services:
  backend:
    build: ./backend
    container_name: calendar-backend
    ports:
      - "8000:8000"
    volumes:
      - calendar_db:/app/data   # named volume — visible in Docker Desktop
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/calendar.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: calendar-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  calendar_db:
