// ─── Input ──────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  gs.keys[e.code] = true;
  if (gs.screen === 'title' && (e.code === 'Enter' || e.code === 'Space')) {
    gs.screen = 'mapselect';
  } else if (gs.screen === 'mapselect') {
    handleMapSelectInput(e.code);
  } else if (gs.screen === 'select') {
    handleKartSelectInput(e.code);
  } else if (gs.screen === 'results' && (e.code === 'Enter' || e.code === 'Space')) {
    initState(); initTitleKarts();
  }
});
document.addEventListener('keyup', e => { gs.keys[e.code] = false; });

// ─── Map selection ────────────────────────────────
function handleMapSelectInput(code) {
  if (code === 'ArrowLeft' || code === 'KeyA')  gs.selectedMap = (gs.selectedMap + 4) % 5;
  if (code === 'ArrowRight' || code === 'KeyD') gs.selectedMap = (gs.selectedMap + 1) % 5;
  if (code === 'Enter' || code === 'Space') gs.screen = 'select';
}

// ─── Kart selection ────────────────────────────────

  if (code === 'ArrowLeft' || code === 'KeyA')  gs.selectedColor = (gs.selectedColor + 3) % 4;
  if (code === 'ArrowRight' || code === 'KeyD') gs.selectedColor = (gs.selectedColor + 1) % 4;
  if (code === 'Enter' || code === 'Space') startRace();
}

// ═══════════════════════════════════════════════════════════════════════
// GEOMETRY HELPERS
// ═══════════════════════════════════════════════════════════════════════
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function lerp(a, b, t) { return a + (b - a) * t; }
function angleTo(from, to) { return Math.atan2(to.y - from.y, to.x - from.x); }
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI)  d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function angleDiff(a, b) {
  let d = ((b - a) % (Math.PI*2) + Math.PI*3) % (Math.PI*2) - Math.PI;
  return d;
}
function ptOnSegment(px,py,ax,ay,bx,by) {
  const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
  if(len2===0) return {x:ax,y:ay,t:0};
  let t=((px-ax)*dx+(py-ay)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  return {x:ax+t*dx, y:ay+t*dy, t};
}
function nearestPointOnTrack(px, py, wps) {
  let best = Infinity, bestSeg = 0, bestT = 0;
  for (let i = 0; i < wps.length - 1; i++) {
    const p = ptOnSegment(px,py,wps[i].x,wps[i].y,wps[i+1].x,wps[i+1].y);
    const d = Math.hypot(px - p.x, py - p.y);
    if (d < best) { best = d; bestSeg = i; bestT = p.t; }
  }
  return {dist: best, seg: bestSeg, t: bestT};
}

// ═══════════════════════════════════════════════════════════════════════
// TRACK PROGRESS (for race position sorting)
// ═══════════════════════════════════════════════════════════════════════
function trackProgress(kart, wps) {
  const n = nearestPointOnTrack(kart.x, kart.y, wps);
  return kart.lap * 1000 + n.seg + n.t;
}

// ═══════════════════════════════════════════════════════════════════════
// ITEM BOXES SETUP
// ═══════════════════════════════════════════════════════════════════════
function buildItemBoxes(map) {
  const wps = map.waypoints;
  const boxes = [];
  const step = Math.max(2, Math.floor(wps.length / 8));
  for (let i = 0; i < wps.length - 1; i += step) {
    const a = wps[i], b = wps[(i+1) % (wps.length-1)];
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const nx = -(b.y-a.y), ny = (b.x-a.x);
    const nl = Math.hypot(nx,ny);
    boxes.push({x: mx + nx/nl*40, y: my + ny/nl*40, active:true, timer:0});
    boxes.push({x: mx - nx/nl*40, y: my - ny/nl*40, active:true, timer:0});
  }
  return boxes;
}

// ═══════════════════════════════════════════════════════════════════════
// KART FACTORY
// ═══════════════════════════════════════════════════════════════════════
function makeKart(colorIdx, isPlayer, startPos, startAngle, wpIdx) {
  return {
    x: startPos.x + (isPlayer ? 0 : (colorIdx-1)*60),
    y: startPos.y + (isPlayer ? 0 : (colorIdx-0.5)*40),
    angle: startAngle,
    vx: 0, vy: 0,
    speed: 0,
    isPlayer,
    colorIdx,
    item: null,
    itemRoulette: false,
    itemTimer: 0,
    lap: 0,
    checkpoint: 0,
    lastWp: wpIdx || 0,
    finished: false,
    finishPos: 0,
    finishTime: 0,
    spinTimer: 0,
    inkTimer: 0,
    starTimer: 0,
    invincTimer: 0,
    // drift / turbo
    drifting: false,
    driftDir: 0,
    turboMeter: 0,
    turboActive: false,
    turboTimer: 0,
    turboSpeed: 0,
    driftSide: 0,
    // jump
    jumpZ: 0,
    jumpVZ: 0,
    airborne: false,
    // AI
    wpTarget: wpIdx || 1,
    aiTimer: 0,
  };
}

// ═══════════════════════════════════════════════════════════════════════
// START RACE
// ═══════════════════════════════════════════════════════════════════════
function startRace() {
  const map = MAPS[gs.selectedMap];
  gs.map = map;
  gs.screen = 'countdown';
  gs.countdown = 3;
  gs.countdownTimer = 0;
  gs.raceTimer = 0;
  gs.raceTime = 0;

  const sp = map.startPos;
  const sa = map.startAngle || 0;
  const wps = map.waypoints;

  gs.karts = [
    makeKart(gs.selectedColor, true,  {x:sp.x,      y:sp.y},      sa, 0),
    makeKart((gs.selectedColor+1)%4, false, {x:sp.x+80,   y:sp.y+50},  sa, 0),
    makeKart((gs.selectedColor+2)%4, false, {x:sp.x-80,   y:sp.y+50},  sa, 0),
    makeKart((gs.selectedColor+3)%4, false, {x:sp.x,      y:sp.y+100}, sa, 0),
  ];

  gs.projectiles = [];
  gs.bananas = [];
  gs.inkBlobs = [];
  gs.particles = [];
  gs.results = [];

  gs.itemBoxes = buildItemBoxes(map);
  gs.turboBoxes = (map.turboPickups || []).map(p => ({x:p.x, y:p.y, active:true, timer:0}));

  // Camera center on player
  const pk = gs.karts[0];
  gs.camera = { x: pk.x - W/2, y: pk.y - H/2 };
}

// ═══════════════════════════════════════════════════════════════════════
function spawnParticle(x,y,color,vx,vy,life,size) {
  gs.particles.push({x,y,color,vx,vy,life,maxLife:life,size:size||5});
}
function spawnDustPuff(x,y) {
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*2+1;
    spawnParticle(x,y,'rgba(200,200,180,0.8)',Math.cos(a)*s,Math.sin(a)*s,25,6);
  }
}
function spawnSparkBurst(x,y,color,count) {
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*3+1.5;
    spawnParticle(x,y,color,Math.cos(a)*s,Math.sin(a)*s,20,4);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// OFF-ROAD CHECK
// ═══════════════════════════════════════════════════════════════════════
function isOffRoad(kart, map) {
  const nearest = nearestPointOnTrack(kart.x, kart.y, map.waypoints);
  return nearest.dist > map.roadWidth / 2;
}

// ═══════════════════════════════════════════════════════════════════════
// CHECKPOINT LOGIC
// ═══════════════════════════════════════════════════════════════════════
function updateCheckpoint(kart, map) {
  const wps = map.waypoints;
  const n = wps.length - 1; // last wp = first wp (closed loop)
  const next = (kart.lastWp + 1) % n;
  const wp = wps[next];
  if (dist(kart, wp) < 120) {
    kart.lastWp = next;
    if (next === 0) {
      kart.lap++;
      if (kart.isPlayer) {
        gs.lapTimes = gs.lapTimes || [];
        gs.lapTimes.push(gs.raceTime);
      }
      if (kart.lap >= TOTAL_LAPS && !kart.finished) {
        kart.finished = true;
        kart.finishTime = gs.raceTime;
        kart.finishPos = gs.results.length + 1;
        gs.results.push({colorIdx: kart.colorIdx, time: kart.finishTime, isPlayer: kart.isPlayer});
        if (kart.isPlayer) {
          gs.screen = 'results';
        }
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// RESPAWN
// ═══════════════════════════════════════════════════════════════════════
function respawnKart(kart, map) {
  const wps = map.waypoints;
  const wp = wps[kart.lastWp];
  const prev = wps[Math.max(0, kart.lastWp - 1)];
  kart.x = wp.x;
  kart.y = wp.y;
  kart.vx = 0; kart.vy = 0; kart.speed = 0;
  kart.angle = angleTo(prev, wp);
  kart.jumpZ = 0; kart.jumpVZ = 0; kart.airborne = false;
  kart.invincTimer = 120;
  kart.drifting = false; kart.turboMeter = 0;
  spawnDustPuff(kart.x, kart.y);
  gs.screenShake = 8;
}

// ═══════════════════════════════════════════════════════════════════════
// TUNNEL CHECK
// ═══════════════════════════════════════════════════════════════════════
function inTunnel(kart, map) {
  for (const tz of (map.tunnelZones || [])) {
    if (Math.hypot(kart.x - tz.x, kart.y - tz.y) < tz.r) return true;
  }
  return false;
}

// ═══════════════════════════════════════════════════════════════════════
// JUMP CHECK
// ═══════════════════════════════════════════════════════════════════════
function checkJump(kart, map) {
  if (kart.airborne) return;
  for (const jz of (map.jumpZones || [])) {
    if (Math.hypot(kart.x - jz.x, kart.y - jz.y) < jz.r) {
      kart.airborne = true;
      kart.jumpZ = 0;
      kart.jumpVZ = 5.5;
      spawnDustPuff(kart.x, kart.y);
      break;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// UPDATE JUMP
// ═══════════════════════════════════════════════════════════════════════
function updateJump(kart) {
  if (!kart.airborne) return;
  kart.jumpVZ -= 0.35;
  kart.jumpZ += kart.jumpVZ;
  if (kart.jumpZ <= 0) {
    kart.jumpZ = 0; kart.jumpVZ = 0; kart.airborne = false;
    spawnDustPuff(kart.x, kart.y);
    gs.screenShake = 4;
  }
}

function driftSparkColor(meter) {
  if (meter < 33) return '#ffe066';
  if (meter < 66) return '#ff8800';
  return '#66aaff';
}

function updatePlayer(dt) {
  const k = gs.karts[0];
  const map = gs.map;
  const keys = gs.keys;
  if (k.finished || k.spinTimer > 0) {
    if (k.spinTimer > 0) { k.angle += 0.18; k.speed *= 0.88; k.spinTimer--; }
    applyVelocity(k, map, dt);
    updateJump(k);
    return;
  }
  if (k.inkTimer > 0) k.inkTimer--;
  if (k.invincTimer > 0) k.invincTimer--;
  if (k.starTimer > 0) k.starTimer--;

  const maxSpd = k.starTimer > 0 ? 9 : (k.turboActive ? k.turboSpeed : getMaxSpeed(map));
  const friction = getFriction(map);
  const turnSpd = getTurnSpeed(map);
  const accel = k.starTimer > 0 ? 0.22 : ACCEL;

  const up = keys['ArrowUp']   || keys['KeyW'];
  const dn = keys['ArrowDown'] || keys['KeyS'];
  const lt = keys['ArrowLeft'] || keys['KeyA'];
  const rt = keys['ArrowRight']|| keys['KeyD'];
  const sp = keys['Space'];

  const offRoad = isOffRoad(k, map) && !k.airborne;
  const surfaceFriction = offRoad ? 0.07 : friction;
  const surfaceMaxSpd  = offRoad ? maxSpd * 0.55 : maxSpd;

  // Turbo timer
  if (k.turboActive) {
    k.turboTimer--;
    if (k.turboTimer <= 0) { k.turboActive = false; }
  }

  // Acceleration
  if (up) k.speed = Math.min(k.speed + accel, surfaceMaxSpd);
  else if (dn) k.speed = Math.max(k.speed - accel * 1.5, -surfaceMaxSpd * 0.5);
  else { k.speed = Math.sign(k.speed) * Math.max(0, Math.abs(k.speed) - surfaceFriction * 2); }

  // Drift logic
  const canDrift = (lt || rt) && sp && k.speed > 1.5 && !k.airborne;
  if (canDrift && !k.drifting) {
    k.drifting = true;
    k.driftDir = lt ? -1 : 1;
    k.driftSide = lt ? -1 : 1;
  }
  if (!sp || (!lt && !rt)) {
    if (k.drifting) {
      // Release drift — award turbo
      const meter = k.turboMeter;
      if (meter >= 100) {
        k.turboActive = true; k.turboSpeed = 9; k.turboTimer = 108;
        spawnSparkBurst(k.x, k.y, '#66aaff', 20);
        gs.screenShake = 10;
      } else if (meter >= 66) {
        k.turboActive = true; k.turboSpeed = 7.5; k.turboTimer = 72;
        spawnSparkBurst(k.x, k.y, '#ff8800', 14);
        gs.screenShake = 7;
      } else if (meter >= 33) {
        k.turboActive = true; k.turboSpeed = 6.5; k.turboTimer = 48;
        spawnSparkBurst(k.x, k.y, '#ffe066', 10);
        gs.screenShake = 4;
      }
      k.drifting = false;
      k.turboMeter = 0;
    }
  }

  // Steering
  if (k.drifting) {
    const driftTurn = turnSpd * 1.35;
    if (lt) k.angle -= driftTurn;
    if (rt) k.angle += driftTurn;
    // Fill turbo meter
    const fillRate = map.icePhysics ? 0.4 : 0.7;
    k.turboMeter = Math.min(100, k.turboMeter + fillRate);
    // Drift sparks
    if (Math.random() < 0.6) {
      const behind = k.angle + Math.PI + k.driftSide * 0.5;
      const sx = k.x + Math.cos(behind) * 22, sy = k.y + Math.sin(behind) * 22;
      spawnParticle(sx, sy, driftSparkColor(k.turboMeter),
        (Math.random()-0.5)*3, (Math.random()-0.5)*3, 18, 4);
    }
  } else {
    if (lt && k.speed > 0.3) k.angle -= turnSpd * (k.speed / maxSpd);
    if (rt && k.speed > 0.3) k.angle += turnSpd * (k.speed / maxSpd);
  }

  // Velocity from heading (with drift slide)
  if (k.drifting) {
    const slideAngle = k.angle + k.driftSide * 0.38;
    const targetVX = Math.cos(slideAngle) * k.speed;
    const targetVY = Math.sin(slideAngle) * k.speed;
    k.vx = lerp(k.vx, targetVX, 0.18);
    k.vy = lerp(k.vy, targetVY, 0.18);
  } else {
    k.vx = lerp(k.vx, Math.cos(k.angle) * k.speed, map.icePhysics ? 0.06 : 0.22);
    k.vy = lerp(k.vy, Math.sin(k.angle) * k.speed, map.icePhysics ? 0.06 : 0.22);
  }

  applyVelocity(k, map, dt);
  updateJump(k);

  // Void respawn
  if (map.voidEdges && isOffRoad(k, map) && !k.airborne) {
    if (!k._offRoadTimer) k._offRoadTimer = 0;
    k._offRoadTimer++;
    if (k._offRoadTimer > 30) { respawnKart(k, map); k._offRoadTimer = 0; }
  } else { k._offRoadTimer = 0; }

  checkJump(k, map);
  updateCheckpoint(k, map);
  updateItemBoxCollision(k);
  updateTurboBoxCollision(k);
}

// ═══════════════════════════════════════════════════════════════════════
// APPLY VELOCITY (move kart)
// ═══════════════════════════════════════════════════════════════════════
function applyVelocity(k, map, dt) {
  k.x += k.vx;
  k.y += k.vy;
  // Wall / world bounds (loose)
  k.x = Math.max(50, Math.min(3100, k.x));
  k.y = Math.max(50, Math.min(2450, k.y));
}

// ═══════════════════════════════════════════════════════════════════════
// AI UPDATE
// ═══════════════════════════════════════════════════════════════════════
function updateAI(kart, dt) {
  const map = gs.map;
  const wps = map.waypoints;
  const n = wps.length - 1;

  if (kart.finished) return;
  if (kart.spinTimer > 0) { kart.angle += 0.18; kart.speed *= 0.88; kart.spinTimer--; applyVelocity(kart,map,dt); return; }
  if (kart.invincTimer > 0) kart.invincTimer--;
  if (kart.turboActive) { kart.turboTimer--; if(kart.turboTimer<=0) kart.turboActive=false; }
  if (kart.starTimer > 0) kart.starTimer--;

  // Lookahead 3 waypoints
  const wp0 = wps[kart.wpTarget % n];
  const wp1 = wps[(kart.wpTarget+1) % n];
  const wp2 = wps[(kart.wpTarget+2) % n];

  // Weighted lookahead target
  const tx = wp0.x * 0.6 + wp1.x * 0.3 + wp2.x * 0.1;
  const ty = wp0.y * 0.6 + wp1.y * 0.3 + wp2.y * 0.1;

  const targetAngle = angleTo(kart, {x:tx, y:ty});
  const da = angleDiff(kart.angle, targetAngle);

  // Track edge repulsion
  const nearest = nearestPointOnTrack(kart.x, kart.y, wps);
  const edgeDist = nearest.dist;
  const repulsion = edgeDist > map.roadWidth * 0.35 ? 0.08 : 0;

  // Steer
  const turnRate = map.icePhysics ? 0.032 : 0.052;
  kart.angle = lerpAngle(kart.angle, targetAngle + (da > 0 ? repulsion : -repulsion), turnRate);

  // Speed modulation
  const cornerSharpness = Math.abs(da);
  const speedScale = kart.turboActive ? 1 : (kart.starTimer>0 ? 1.3 : 1.0);
  const targetSpeed = cornerSharpness > 0.6 ? 3.2 * speedScale : (4.5 + Math.random()*0.3) * speedScale;
  kart.speed = lerp(kart.speed, targetSpeed, 0.06);

  // Rubber banding
  const player = gs.karts[0];
  const playerProg = trackProgress(player, wps);
  const aiProg = trackProgress(kart, wps);
  if (aiProg > playerProg + 80) kart.speed *= 0.92;
  if (aiProg < playerProg - 80) kart.speed = Math.min(kart.speed * 1.08, 5.5);

  kart.vx = lerp(kart.vx, Math.cos(kart.angle)*kart.speed, map.icePhysics ? 0.08 : 0.25);
  kart.vy = lerp(kart.vy, Math.sin(kart.angle)*kart.speed, map.icePhysics ? 0.08 : 0.25);

  applyVelocity(kart, map, dt);
  updateJump(kart, map);

  if (dist(kart, wp0) < 130) {
    kart.wpTarget = (kart.wpTarget + 1) % n;
  }

  // Void respawn for AI
  if (map.voidEdges && isOffRoad(kart, map) && !kart.airborne) {
    if (!kart._offRoadTimer) kart._offRoadTimer = 0;
    kart._offRoadTimer++;
    if (kart._offRoadTimer > 25) { respawnKart(kart, map); kart._offRoadTimer = 0; }
  } else { kart._offRoadTimer = 0; }

  checkJump(kart, map);
  updateCheckpoint(kart, map);
  updateItemBoxCollision(kart);
  updateTurboBoxCollision(kart);

  // AI item use
  if (kart.item && Math.random() < 0.003) useItem(kart);
}

// ═══════════════════════════════════════════════════════════════════════
// ITEM BOX COLLISION
// ═══════════════════════════════════════════════════════════════════════
const ITEMS = ['mushroom','triMushroom','greenShell','redShell','banana','lightning','star','ink','turboTank'];
const ITEM_EMOJI = {
  mushroom:'🍄', triMushroom:'🍄🍄🍄', greenShell:'🐢', redShell:'🔴',
  banana:'🍌', lightning:'⚡', star:'⭐', ink:'🦑', turboTank:'⚡🔋',
};
function itemWeight(kart) {
  // Rubber-band: losing kart gets better items
  const player = gs.karts[0];
  const wps = gs.map.waypoints;
  const pp = trackProgress(player, wps);
  const kp = trackProgress(kart, wps);
  const behind = pp - kp;
  if (kart.isPlayer) {
    if (behind < -50) return ['mushroom','triMushroom','greenShell'];
    if (behind < 50)  return ITEMS.filter(i=>i!=='star'&&i!=='lightning');
    return ITEMS;
  }
  return ITEMS.filter(i=>!['star','lightning'].includes(i));
}
function updateItemBoxCollision(kart) {
  if (kart.item) return;
  for (const box of gs.itemBoxes) {
    if (!box.active) continue;
    if (dist(kart, box) < 38) {
      box.active = false; box.timer = 300;
      const pool = itemWeight(kart);
      kart.item = pool[Math.floor(Math.random()*pool.length)];
      kart.itemRoulette = true; kart.itemTimer = ITEM_ROULETTE_TIME;
      break;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// TURBO BOX COLLISION
// ═══════════════════════════════════════════════════════════════════════
function updateTurboBoxCollision(kart) {
  for (const box of gs.turboBoxes) {
    if (!box.active) continue;
    if (dist(kart, box) < 38) {
      box.active = false; box.timer = 400;
      kart.turboMeter = 100;
      spawnSparkBurst(kart.x, kart.y, '#66aaff', 14);
      if (kart.isPlayer) gs.screenShake = 6;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// USE ITEM
// ═══════════════════════════════════════════════════════════════════════
function useItem(kart) {
  if (!kart.item) return;
  const item = kart.item;
  const wps = gs.map.waypoints;

  if (item === 'mushroom') {
    kart.turboActive = true; kart.turboSpeed = 7; kart.turboTimer = 50;
    spawnSparkBurst(kart.x, kart.y, '#ff8800', 10);
    kart.item = null;
  } else if (item === 'triMushroom') {
    kart.turboActive = true; kart.turboSpeed = 7; kart.turboTimer = 150;
    kart.item = null;
  } else if (item === 'turboTank') {
    kart.turboMeter = 100;
    spawnSparkBurst(kart.x, kart.y, '#66aaff', 16);
    kart.item = null;
  } else if (item === 'greenShell') {
    gs.projectiles.push({
      x:kart.x, y:kart.y,
      vx: Math.cos(kart.angle)*8, vy: Math.sin(kart.angle)*8,
      type:'green', life:180, firedBy:kart,
    });
    kart.item = null;
  } else if (item === 'redShell') {
    // target nearest ahead
    let target = null, bestDist = Infinity;
    for (const k2 of gs.karts) {
      if (k2 === kart || k2.finished) continue;
      const d = dist(kart, k2);
      if (d < bestDist) { bestDist = d; target = k2; }
    }
    gs.projectiles.push({
      x:kart.x, y:kart.y,
      vx: Math.cos(kart.angle)*6, vy: Math.sin(kart.angle)*6,
      type:'red', life:240, firedBy:kart, target,
    });
    kart.item = null;
  } else if (item === 'banana') {
    gs.bananas.push({x:kart.x + Math.cos(kart.angle+Math.PI)*30, y:kart.y + Math.sin(kart.angle+Math.PI)*30});
    kart.item = null;
  } else if (item === 'lightning') {
    for (const k2 of gs.karts) {
      if (k2 === kart || k2.starTimer > 0) continue;
      k2.speed *= 0.3;
      k2.spinTimer = 30;
    }
    gs.screenShake = 12;
    kart.item = null;
  } else if (item === 'star') {
    kart.starTimer = 360;
    kart.turboActive = true; kart.turboSpeed = 9; kart.turboTimer = 360;
    kart.item = null;
  } else if (item === 'ink') {
    for (const k2 of gs.karts) {
      if (k2 === kart || k2.invincTimer > 0) continue;
      k2.inkTimer = 200;
    }
    kart.item = null;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// PROJECTILE UPDATE
// ═══════════════════════════════════════════════════════════════════════
function updateProjectiles() {
  for (let i = gs.projectiles.length-1; i >= 0; i--) {
    const p = gs.projectiles[i];
    if (p.type === 'red' && p.target && !p.target.finished) {
      const ta = angleTo(p, p.target);
      p.vx = lerp(p.vx, Math.cos(ta)*6, 0.1);
      p.vy = lerp(p.vy, Math.sin(ta)*6, 0.1);
    }
    p.x += p.vx; p.y += p.vy; p.life--;
    // Bounce green shells off track edges
    if (p.type === 'green') {
      const nr = nearestPointOnTrack(p.x, p.y, gs.map.waypoints);
      if (nr.dist > gs.map.roadWidth/2 + 20) { p.vx *= -1; p.vy *= -1; }
    }
    if (p.life <= 0) { gs.projectiles.splice(i,1); continue; }
    // Hit karts
    for (const k2 of gs.karts) {
      if (k2 === p.firedBy || k2.invincTimer > 0 || k2.starTimer > 0 || k2.airborne) continue;
      if (dist(p, k2) < 28) {
        k2.spinTimer = 60; k2.speed *= 0.2;
        spawnSparkBurst(k2.x, k2.y, '#fff', 12);
        gs.screenShake = 8;
        gs.projectiles.splice(i,1);
        break;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// BANANA UPDATE
// ═══════════════════════════════════════════════════════════════════════
function updateBananas() {
  for (let i = gs.bananas.length-1; i >= 0; i--) {
    const b = gs.bananas[i];
    for (const k of gs.karts) {
      if (k.invincTimer > 0 || k.airborne) continue;
      if (dist(k, b) < 26) {
        k.spinTimer = 50; k.speed *= 0.3;
        spawnSparkBurst(k.x, k.y, '#f1c40f', 10);
        gs.bananas.splice(i,1);
        break;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// PARTICLE UPDATE
// ═══════════════════════════════════════════════════════════════════════
function updateParticles() {
  for (let i = gs.particles.length-1; i >= 0; i--) {
    const p = gs.particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life--;
    if (p.life <= 0) gs.particles.splice(i,1);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ITEM BOX TIMER
// ═══════════════════════════════════════════════════════════════════════
function updateItemBoxTimers() {
  for (const b of gs.itemBoxes) {
    if (!b.active) { b.timer--; if(b.timer<=0) b.active=true; }
  }
  for (const b of gs.turboBoxes) {
    if (!b.active) { b.timer--; if(b.timer<=0) b.active=true; }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════════════════════
function updateCamera() {
  const pk = gs.karts[0];
  const tx = pk.x - W/2;
  const ty = pk.y - H/2;
  gs.camera.x = lerp(gs.camera.x, tx, 0.12);
  gs.camera.y = lerp(gs.camera.y, ty, 0.12);
  if (gs.screenShake > 0) {
    gs.camera.x += (Math.random()-0.5)*gs.screenShake;
    gs.camera.y += (Math.random()-0.5)*gs.screenShake;
    gs.screenShake *= 0.85;
    if (gs.screenShake < 0.5) gs.screenShake = 0;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ITEM ROULETTE
// ═══════════════════════════════════════════════════════════════════════
function updateItemRoulette(kart, dt) {
  if (!kart.itemRoulette) return;
  kart.itemTimer -= dt;
  if (kart.itemTimer > 0) {
    const pool = ITEMS;
    kart.item = pool[Math.floor(Date.now()/80) % pool.length];
  } else {
    kart.itemRoulette = false;
    const pool = itemWeight(kart);
    kart.item = pool[Math.floor(Math.random()*pool.length)];
  }
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN UPDATE
// ═══════════════════════════════════════════════════════════════════════
let lastTime = 0;
function update(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  if (gs.screen === 'title') {
    updateTitleKarts(dt);
  } else if (gs.screen === 'mapselect' || gs.screen === 'select') {
    // nothing
  } else if (gs.screen === 'countdown') {
    gs.countdownTimer += dt;
    if (gs.countdownTimer > 1000) {
      gs.countdownTimer = 0;
      gs.countdown--;
      if (gs.countdown < 0) gs.screen = 'race';
    }
  } else if (gs.screen === 'race') {
    gs.raceTime += dt;
    updatePlayer(dt);
    for (let i = 1; i < gs.karts.length; i++) updateAI(gs.karts[i], dt);
    updateProjectiles();
    updateBananas();
    updateParticles();
    updateItemBoxTimers();
    updateCamera();
    updateItemRoulette(gs.karts[0], dt);
    // Lava platforms movement
    if (gs.map.lavaPlatforms) {
      gs.map.lavaPlatforms.forEach(p => {
        p._t = (p._t || 0) + dt/1000;
        p.cx = p.x + Math.sin(p._t * Math.PI * 2 / p.period) * p.amp;
        p.cy = p.y;
      });
    }
  }

  draw();
  requestAnimationFrame(update);
}

// ─── Title kart animation ────────────────────────────────────────────
function updateTitleKarts(dt) {
  for (const k of gs.titleKarts) {
    k.x += k.speed;
    if (k.x > W + 60) k.x = -60;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW HELPERS
// ═══════════════════════════════════════════════════════════════════════
function drawRoundedRect(x,y,w,h,r,fill,stroke,sw) {
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw||2; ctx.stroke(); }
}

function drawText(txt, x, y, size, color, align) {
  ctx.font = `${size}px Bungee, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'center';
  ctx.fillText(txt, x, y);
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW KART
// ═══════════════════════════════════════════════════════════════════════
function drawKart(k, camX, camY) {
  const sx = k.x - camX;
  const sy = k.y - camY - k.jumpZ;
  const scale = k.airborne ? 1 + k.jumpZ * 0.015 : 1;

  // Shadow when airborne
  if (k.airborne && k.jumpZ > 2) {
    ctx.save();
    ctx.translate(k.x - camX, k.y - camY);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 0, (KART_W/2)*scale*0.9, (KART_H/2)*0.6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(k.angle);
  ctx.scale(scale, scale);

  // Star shimmer
  if (k.starTimer > 0 && Math.floor(Date.now()/100)%2===0) {
    ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 20;
  }
  // Invincibility flash
  if (k.invincTimer > 0 && Math.floor(Date.now()/80)%2===0) {
    ctx.globalAlpha = 0.4;
  }

  // Body
  ctx.fillStyle = KART_COLORS[k.colorIdx];
  ctx.beginPath();
  ctx.roundRect(-KART_W/2, -KART_H/2, KART_W, KART_H, 7);
  ctx.fill();

  // Cockpit
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(4, 0, KART_W*0.22, KART_H*0.35, 0, 0, Math.PI*2);
  ctx.fill();

  // Wheels
  const wc = '#333';
  [[KART_W*0.35, KART_H*0.5],[KART_W*0.35,-KART_H*0.5],[-KART_W*0.35,KART_H*0.5],[-KART_W*0.35,-KART_H*0.5]].forEach(([wx,wy])=>{
    ctx.fillStyle = wc;
    ctx.beginPath(); ctx.roundRect(wx-7, wy-4, 14, 8, 3); ctx.fill();
  });

  // Drift indicator
  if (k.drifting) {
    ctx.strokeStyle = driftSparkColor(k.turboMeter);
    ctx.lineWidth = 3;
    ctx.strokeRect(-KART_W/2-3, -KART_H/2-3, KART_W+6, KART_H+6);
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW TRACK (road following waypoints)
// ═══════════════════════════════════════════════════════════════════════
function drawTrack(map, camX, camY) {
  const wps = map.waypoints;
  const rw = map.roadWidth;

  // Background
  ctx.fillStyle = map.bgColor;
  ctx.fillRect(0, 0, W, H);

  // Draw special map backgrounds
  if (gs.selectedMap === 4) {
    // Space stars for Rainbow Road
    for (const s of (gs.stars || [])) {
      const alpha = 0.5 + 0.5*Math.sin(s.twinkle + Date.now()/800);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
  }

  // Road surface
  ctx.strokeStyle = map.roadColor;
  ctx.lineWidth = rw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(wps[0].x - camX, wps[0].y - camY);
  for (let i = 1; i < wps.length; i++) {
    ctx.lineTo(wps[i].x - camX, wps[i].y - camY);
  }
  ctx.stroke();

  // Rainbow Road special coloring
  if (gs.selectedMap === 4) {
    for (let i = 1; i < wps.length; i++) {
      const hue = (i / wps.length * 360 + Date.now()/20) % 360;
      ctx.strokeStyle = `hsl(${hue},100%,60%)`;
      ctx.lineWidth = rw * 0.8;
      ctx.beginPath();
      ctx.moveTo(wps[i-1].x - camX, wps[i-1].y - camY);
      ctx.lineTo(wps[i].x - camX, wps[i].y - camY);
      ctx.stroke();
    }
    // Edge lines (danger edges)
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 4;
    ctx.setLineDash([20,15]);
    ctx.beginPath();
    ctx.moveTo(wps[0].x - camX, wps[0].y - camY);
    for (let i = 1; i < wps.length; i++) ctx.lineTo(wps[i].x - camX, wps[i].y - camY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Ice map: add ice sheen
  if (map.icePhysics) {
    ctx.strokeStyle = 'rgba(180,230,255,0.35)';
    ctx.lineWidth = rw * 0.6;
    ctx.beginPath();
    ctx.moveTo(wps[0].x - camX, wps[0].y - camY);
    for (let i = 1; i < wps.length; i++) ctx.lineTo(wps[i].x - camX, wps[i].y - camY);
    ctx.stroke();
  }

  // Lava World: lava glow underneath
  if (gs.selectedMap === 3) {
    ctx.strokeStyle = 'rgba(255,80,0,0.25)';
    ctx.lineWidth = rw + 40;
    ctx.beginPath();
    ctx.moveTo(wps[0].x - camX, wps[0].y - camY);
    for (let i = 1; i < wps.length; i++) ctx.lineTo(wps[i].x - camX, wps[i].y - camY);
    ctx.stroke();
  }

  // Road lane markings
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 3;
  ctx.setLineDash([40, 30]);
  ctx.beginPath();
  ctx.moveTo(wps[0].x - camX, wps[0].y - camY);
  for (let i = 1; i < wps.length; i++) ctx.lineTo(wps[i].x - camX, wps[i].y - camY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Shortcuts (dirt patches)
  for (const sc of (map.shortcuts || [])) {
    ctx.fillStyle = 'rgba(139,90,43,0.65)';
    ctx.beginPath();
    ctx.arc(sc.x - camX, sc.y - camY, sc.r, 0, Math.PI*2);
    ctx.fill();
    drawText(sc.label, sc.x - camX, sc.y - camY + 5, 13, 'rgba(255,220,150,0.9)');
  }

  // Jump ramps
  for (const jz of (map.jumpZones || [])) {
    const sx = jz.x - camX, sy = jz.y - camY;
    const grd = ctx.createRadialGradient(sx,sy,0,sx,sy,jz.r);
    grd.addColorStop(0,'rgba(255,230,80,0.7)');
    grd.addColorStop(1,'rgba(255,180,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(sx,sy,jz.r,0,Math.PI*2); ctx.fill();
    drawText('JUMP', sx, sy+5, 14, 'rgba(255,255,255,0.9)');
  }

  // Tunnel zones (draw dark overlay)
  for (const tz of (map.tunnelZones || [])) {
    const sx = tz.x - camX, sy = tz.y - camY;
    ctx.fillStyle = 'rgba(20,10,0,0.55)';
    ctx.beginPath(); ctx.arc(sx,sy,tz.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(sx,sy,tz.r,0,Math.PI*2); ctx.stroke();
    drawText('TUNNEL', sx, sy+5, 13, 'rgba(200,200,200,0.8)');
  }

  // Lava platforms
  if (map.lavaPlatforms) {
    map.lavaPlatforms.forEach(p => {
      const px = (p.cx||p.x) - camX, py = (p.cy||p.y) - camY;
      ctx.fillStyle = '#ff4400';
      ctx.beginPath(); ctx.roundRect(px-p.w/2, py-p.h/2, p.w, p.h, 8); ctx.fill();
      ctx.fillStyle = '#ff8800';
      ctx.beginPath(); ctx.roundRect(px-p.w/2+4, py-p.h/2+4, p.w-8, p.h-8, 4); ctx.fill();
    });
  }

  // Ruins theme: draw some pillar decorations
  if (gs.selectedMap === 1) {
    const pillars = [{x:900,y:700},{x:1600,y:500},{x:2000,y:1200},{x:700,y:1400}];
    for (const pl of pillars) {
      const px = pl.x - camX, py = pl.y - camY;
      if (px < -80 || px > W+80 || py < -80 || py > H+80) continue;
      ctx.fillStyle = '#8b7355';
      ctx.beginPath(); ctx.roundRect(px-20, py-50, 40, 60, 4); ctx.fill();
      ctx.fillStyle = '#a09070';
      ctx.beginPath(); ctx.roundRect(px-25, py-60, 50, 15, 3); ctx.fill();
    }
  }

  // Start/finish line
  const sfp = map.waypoints[0];
  const sfx = sfp.x - camX, sfy = sfp.y - camY;
  // Checker pattern
  for (let ci = 0; ci < 8; ci++) {
    ctx.fillStyle = ci%2===0 ? '#fff' : '#111';
    ctx.fillRect(sfx - rw/2 + ci*(rw/8), sfy - 8, rw/8, 16);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW ITEM BOXES
// ═══════════════════════════════════════════════════════════════════════
function drawItemBoxes(camX, camY) {
  const t = Date.now()/600;
  for (const b of gs.itemBoxes) {
    if (!b.active) continue;
    const sx = b.x - camX, sy = b.y - camY;
    if (sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(t);
    const grd = ctx.createRadialGradient(0,0,0,0,0,18);
    grd.addColorStop(0,'rgba(255,255,200,0.95)');
    grd.addColorStop(0.6,'rgba(255,200,50,0.8)');
    grd.addColorStop(1,'rgba(255,150,0,0.4)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.roundRect(-16,-16,32,32,6); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-16,-16,32,32,6); ctx.stroke();
    ctx.font = '18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('?', 0, 1);
    ctx.restore();
  }
  // Turbo pickups
  for (const b of gs.turboBoxes) {
    if (!b.active) continue;
    const sx = b.x - camX, sy = b.y - camY;
    if (sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;
    ctx.save();
    ctx.translate(sx, sy);
    const glow = Math.sin(Date.now()/300)*0.5+0.5;
    ctx.shadowColor = '#00aaff'; ctx.shadowBlur = 15 + glow*10;
    const grd2 = ctx.createRadialGradient(0,0,0,0,0,18);
    grd2.addColorStop(0,'rgba(100,200,255,0.95)');
    grd2.addColorStop(1,'rgba(0,100,255,0.3)');
    ctx.fillStyle = grd2;
    ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
    ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⚡', 0, 1);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW PROJECTILES & BANANAS
// ═══════════════════════════════════════════════════════════════════════
function drawProjectilesAndBananas(camX, camY) {
  for (const p of gs.projectiles) {
    const sx = p.x - camX, sy = p.y - camY;
    ctx.save();
    ctx.translate(sx, sy);
    if (p.type === 'green') {
      ctx.fillStyle = '#27ae60';
      ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🐢',0,1);
    } else {
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🔴',0,1);
    }
    ctx.restore();
  }
  for (const b of gs.bananas) {
    const sx = b.x - camX, sy = b.y - camY;
    ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🍌', sx, sy);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW PARTICLES
// ═══════════════════════════════════════════════════════════════════════
function drawParticles(camX, camY) {
  for (const p of gs.particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y - camY, p.size * alpha, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════════════════════════════
function drawHUD() {
  const pk = gs.karts[0];
  // Lap counter
  const lapText = pk.finished ? 'FINISHED' : `LAP ${Math.min(pk.lap+1, TOTAL_LAPS)}/${TOTAL_LAPS}`;
  drawRoundedRect(10, 10, 160, 44, 8, 'rgba(0,0,0,0.65)', 'rgba(255,255,255,0.2)', 1);
  drawText(lapText, 90, 38, 20, '#fff');

  // Race timer
  const secs = (gs.raceTime / 1000).toFixed(2);
  drawRoundedRect(10, 60, 160, 36, 8, 'rgba(0,0,0,0.55)', null);
  drawText(`⏱ ${secs}`, 90, 83, 16, '#ddd');

  // Item display
  drawRoundedRect(10, 104, 72, 72, 10, 'rgba(0,0,0,0.65)', 'rgba(255,255,255,0.3)', 2);
  if (pk.item) {
    ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ITEM_EMOJI[pk.item]||'?', 46, 140);
  } else {
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.font='28px Bungee'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('?', 46, 142);
  }

  // Use item hint
  drawRoundedRect(10, 182, 72, 20, 5, 'rgba(0,0,0,0.45)', null);
  drawText('[SPC]', 46, 196, 11, 'rgba(255,255,255,0.5)');

  // TURBO METER
  const mx = 10, my = 210, mw = 160, mh = 22;
  const fill = pk.turboMeter / 100;
  const glowing = pk.turboMeter >= 33;
  drawRoundedRect(mx, my, mw, mh, 6, 'rgba(0,0,0,0.65)', 'rgba(255,255,255,0.2)', 1);
  if (fill > 0) {
    const turboGrd = ctx.createLinearGradient(mx,0,mx+mw,0);
    if (fill < 0.33) turboGrd.addColorStop(0,'#ffe066');
    else if (fill < 0.66) { turboGrd.addColorStop(0,'#ffe066'); turboGrd.addColorStop(1,'#ff8800'); }
    else { turboGrd.addColorStop(0,'#ff8800'); turboGrd.addColorStop(0.5,'#66aaff'); turboGrd.addColorStop(1,'#aaddff'); }
    if (glowing) { ctx.shadowColor='#66aaff'; ctx.shadowBlur=8; }
    ctx.fillStyle = turboGrd;
    ctx.beginPath(); ctx.roundRect(mx+2, my+3, (mw-4)*fill, mh-6, 4); ctx.fill();
    ctx.shadowBlur=0;
  }
  drawText('TURBO', mx+mw/2, my+mh/2+5, 11, 'rgba(255,255,255,0.8)');

  if (pk.turboActive) {
    ctx.save();
    ctx.shadowColor='#66aaff'; ctx.shadowBlur=20;
    drawText('BOOST!', W/2, 90, 36, '#66aaff');
    ctx.restore();
  }
  if (pk.starTimer > 0) {
    drawText('★ STAR ★', W/2, 90, 36, '#f1c40f');
  }

  // Speed
  drawRoundedRect(10, 240, 160, 36, 8, 'rgba(0,0,0,0.55)', null);
  const spd = Math.round(Math.hypot(pk.vx, pk.vy) * 30);
  drawText(`${spd} km/h`, 90, 263, 16, '#7ecfff');

  // Race position
  const allKarts = [...gs.karts].filter(k=>!k.finished);
  const wps = gs.map.waypoints;
  allKarts.sort((a,b) => trackProgress(b,wps) - trackProgress(a,wps));
  const pos = allKarts.indexOf(pk) + 1 + gs.results.filter(r=>!r.isPlayer).length;
  const posStr = ['1ST','2ND','3RD','4TH'][Math.min(pos-1,3)] || '?';
  drawRoundedRect(W-100, 10, 90, 44, 8, 'rgba(0,0,0,0.65)', 'rgba(255,255,255,0.2)', 1);
  drawText(posStr, W-55, 37, 22, pos===1?'#f1c40f':'#fff');

  // Minimap
  drawMinimap();

  // Drift indicator
  if (pk.drifting) {
    const dm = pk.turboMeter;
    const phase = Math.floor(Date.now()/150)%2;
    const col = driftSparkColor(dm);
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=12;
    drawText(dm>=100?'MAX DRIFT!':dm>=66?'DRIFT++':'DRIFT', W/2, 130, 22, col);
    ctx.restore();
  }

  // Ink overlay
  if (pk.inkTimer > 0) {
    const alpha = Math.min(pk.inkTimer/50, 0.85);
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '24px Bungee'; ctx.textAlign='center';
    ctx.fillText('SCREEN COVERED!', W/2, H/2);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// MINIMAP
// ═══════════════════════════════════════════════════════════════════════
function drawMinimap() {
  const mmX = W - 170, mmY = H - 160, mmW = 160, mmH = 150;
  const map = gs.map;
  const wps = map.waypoints;

  // Find bounding box of waypoints
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const w of wps){minX=Math.min(minX,w.x);minY=Math.min(minY,w.y);maxX=Math.max(maxX,w.x);maxY=Math.max(maxY,w.y);}
  const scaleX = (mmW-20)/(maxX-minX), scaleY = (mmH-20)/(maxY-minY);
  const sc = Math.min(scaleX, scaleY);
  const offX = mmX + 10 + (mmW-20 - (maxX-minX)*sc)/2 - minX*sc;
  const offY = mmY + 10 + (mmH-20 - (maxY-minY)*sc)/2 - minY*sc;

  drawRoundedRect(mmX, mmY, mmW, mmH, 10, 'rgba(0,0,0,0.7)', 'rgba(255,255,255,0.2)', 1);

  // Track line
  ctx.strokeStyle = map.roadColor;
  ctx.lineWidth = 4; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(wps[0].x*sc+offX, wps[0].y*sc+offY);
  for(let i=1;i<wps.length;i++) ctx.lineTo(wps[i].x*sc+offX, wps[i].y*sc+offY);
  ctx.stroke();

  // Kart dots
  for (const k of gs.karts) {
    const kx = k.x*sc+offX, ky = k.y*sc+offY;
    ctx.fillStyle = KART_COLORS[k.colorIdx];
    ctx.beginPath(); ctx.arc(kx, ky, k.isPlayer ? 4 : 3, 0, Math.PI*2); ctx.fill();
    if (k.isPlayer) {
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(kx,ky,5,0,Math.PI*2); ctx.stroke();
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// SCREEN: MAP SELECT
// ═══════════════════════════════════════════════════════════════════════
const MAP_DIFFICULTY_COLORS = ['#2ecc71','#f1c40f','#e67e22','#e74c3c','#9b59b6'];
function drawMapSelect() {
  ctx.fillStyle = '#0d0020';
  ctx.fillRect(0, 0, W, H);
  for (const s of (gs.stars||[])) {
    ctx.fillStyle=`rgba(255,255,255,${0.3+0.3*Math.sin(s.twinkle+Date.now()/800)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }

  drawText('SELECT MAP', W/2, 65, 42, '#fff');
  drawText('◄  Arrow Keys  ►  |  ENTER to confirm', W/2, 98, 16, 'rgba(255,255,255,0.5)');

  const cardW = 155, cardH = 220, gap = 16;
  const totalW = 5 * cardW + 4 * gap;
  const startX = (W - totalW) / 2;

  for (let i = 0; i < 5; i++) {
    const map = MAPS[i];
    const cx = startX + i * (cardW + gap);
    const cy = 150;
    const selected = i === gs.selectedMap;
    const yOff = selected ? -12 : 0;

    // Card shadow
    if (selected) {
      ctx.save();
      ctx.shadowColor = map.theme; ctx.shadowBlur = 25;
    }
    drawRoundedRect(cx, cy + yOff, cardW, cardH, 14,
      selected ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.6)',
      selected ? map.theme : 'rgba(255,255,255,0.2)',
      selected ? 3 : 1);
    if (selected) ctx.restore();

    // Map preview (colored rectangle with road squiggle)
    ctx.save();
    ctx.beginPath(); ctx.roundRect(cx+8, cy+8+yOff, cardW-16, 110, 8); ctx.clip();
    ctx.fillStyle = map.bgColor;
    ctx.fillRect(cx+8, cy+8+yOff, cardW-16, 110);
    // Draw mini road preview
    const previewWps = MAPS[i].waypoints;
    let pMinX=Infinity,pMinY=Infinity,pMaxX=-Infinity,pMaxY=-Infinity;
    for(const w of previewWps){pMinX=Math.min(pMinX,w.x);pMinY=Math.min(pMinY,w.y);pMaxX=Math.max(pMaxX,w.x);pMaxY=Math.max(pMaxY,w.y);}
    const pScX=(cardW-32)/(pMaxX-pMinX), pScY=90/(pMaxY-pMinY);
    const pSc=Math.min(pScX,pScY);
    const pOX=cx+16+(cardW-32-(pMaxX-pMinX)*pSc)/2-pMinX*pSc;
    const pOY=cy+12+yOff+(90-(pMaxY-pMinY)*pSc)/2-pMinY*pSc;
    ctx.strokeStyle=map.roadColor; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(previewWps[0].x*pSc+pOX, previewWps[0].y*pSc+pOY);
    for(let j=1;j<previewWps.length;j++) ctx.lineTo(previewWps[j].x*pSc+pOX, previewWps[j].y*pSc+pOY);
    ctx.stroke();
    ctx.restore();

    // Map name
    drawText(map.name, cx + cardW/2, cy + 140 + yOff, 14, '#fff');

    // Difficulty stars
    const stars = '★'.repeat(map.difficulty) + '☆'.repeat(5-map.difficulty);
    drawText(stars, cx + cardW/2, cy + 162 + yOff, 14, MAP_DIFFICULTY_COLORS[map.difficulty-1]);

    // Theme label
    drawRoundedRect(cx+8, cy+175+yOff, cardW-16, 22, 6, map.theme+'44', map.theme, 1);
    drawText(map.difficulty <= 2 ? 'NORMAL' : map.difficulty === 3 ? 'SLIPPERY' : map.difficulty === 4 ? 'DANGER' : 'EXTREME',
      cx+cardW/2, cy+190+yOff, 12, map.theme);

    // Selected indicator
    if (selected) {
      drawText('▲', cx + cardW/2, cy + cardH + 18 + yOff, 18, map.theme);
    }
  }

  // Show selected map details
  const sm = MAPS[gs.selectedMap];
  drawRoundedRect(W/2-300, 408, 600, 80, 12, 'rgba(0,0,0,0.6)', sm.theme, 2);
  drawText(sm.name.toUpperCase(), W/2, 435, 22, sm.theme);
  const feats = [];
  if (sm.voidEdges) feats.push('⚠ VOID EDGES');
  if (sm.icePhysics) feats.push('❄ ICE PHYSICS');
  if ((sm.jumpZones||[]).length) feats.push('↑ JUMPS');
  if ((sm.tunnelZones||[]).length) feats.push('◎ TUNNELS');
  drawText(feats.length ? feats.join('  ') : 'Classic Race Track', W/2, 462, 15, 'rgba(255,255,255,0.7)');

  drawText('ENTER to select', W/2, 510, 18, 'rgba(255,255,255,0.4)');
}

// ═══════════════════════════════════════════════════════════════════════
// SCREEN: KART SELECT
// ═══════════════════════════════════════════════════════════════════════
function drawKartSelect() {
  ctx.fillStyle = '#0d0020';
  ctx.fillRect(0, 0, W, H);
  for (const s of (gs.stars||[])) {
    ctx.fillStyle=`rgba(255,255,255,${0.3+0.3*Math.sin(s.twinkle+Date.now()/800)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }

  drawText('SELECT YOUR KART', W/2, 80, 38, '#fff');
  const map = MAPS[gs.selectedMap];
  drawText(`Map: ${map.name}`, W/2, 112, 18, map.theme);

  const cw = 160, gap = 30, totalW = 4*(cw+gap)-gap;
  const startX = (W-totalW)/2;
  for (let i = 0; i < 4; i++) {
    const cx = startX + i*(cw+gap) + cw/2;
    const cy = 300;
    const selected = i === gs.selectedColor;

    ctx.save();
    if (selected) { ctx.shadowColor = KART_COLORS[i]; ctx.shadowBlur = 30; }
    drawRoundedRect(cx-cw/2, cy-80, cw, 160, 14,
      selected ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.5)',
      selected ? KART_COLORS[i] : 'rgba(255,255,255,0.2)',
      selected ? 3 : 1);
    ctx.restore();

    // Draw kart preview
    ctx.save();
    ctx.translate(cx, cy-10);
    ctx.scale(2.2, 2.2);
    ctx.fillStyle = KART_COLORS[i];
    ctx.beginPath(); ctx.roundRect(-KART_W/2,-KART_H/2,KART_W,KART_H,7); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(4,0,KART_W*0.22,KART_H*0.35,0,0,Math.PI*2); ctx.fill();
    const wc='#333';
    [[KART_W*0.35,KART_H*0.5],[KART_W*0.35,-KART_H*0.5],[-KART_W*0.35,KART_H*0.5],[-KART_W*0.35,-KART_H*0.5]].forEach(([wx,wy])=>{
      ctx.fillStyle=wc; ctx.beginPath(); ctx.roundRect(wx-7,wy-4,14,8,3); ctx.fill();
    });
    ctx.restore();

    drawText(KART_NAMES[i], cx, cy+80, 18, selected ? KART_COLORS[i] : 'rgba(255,255,255,0.5)');
    if (selected) drawText('YOU', cx, cy+100, 13, '#fff');
  }

  // Arrow hints
  const blink = Math.floor(Date.now()/500)%2;
  if (blink) {
    drawText('◄', startX - 20, 300, 30, 'rgba(255,255,255,0.7)');
    drawText('►', startX + totalW + 10, 300, 30, 'rgba(255,255,255,0.7)');
  }

  drawText('PRESS ENTER TO RACE!', W/2, 450, 26, '#ffe066');
  drawText('WASD or Arrow Keys', W/2, 490, 16, 'rgba(255,255,255,0.4)');
}

// ═══════════════════════════════════════════════════════════════════════
// SCREEN: COUNTDOWN
// ═══════════════════════════════════════════════════════════════════════
function drawCountdown() {
  // Draw the track in the background
  drawRaceScene();
  // Overlay
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, H);
  const num = gs.countdown > 0 ? gs.countdown : 'GO!';
  const color = gs.countdown > 0 ? '#ffe066' : '#2ecc71';
  const pulse = 1 + Math.sin(gs.countdownTimer/200)*0.15;
  ctx.save();
  ctx.translate(W/2, H/2 - 30);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = color; ctx.shadowBlur = 40;
  drawText(String(num), 0, 0, 110, color);
  ctx.restore();
  drawText('GET READY!', W/2, H/2 + 80, 28, 'rgba(255,255,255,0.7)');
}

// ═══════════════════════════════════════════════════════════════════════
// SCREEN: RESULTS
// ═══════════════════════════════════════════════════════════════════════
function drawResults() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);
  for (const s of (gs.stars||[])) {
    ctx.fillStyle=`rgba(255,255,255,${0.3+0.3*Math.sin(s.twinkle+Date.now()/800)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }

  drawRoundedRect(W/2-300, 30, 600, 90, 16, 'rgba(0,0,0,0.8)', '#f1c40f', 3);
  drawText('RACE RESULTS', W/2, 85, 48, '#f1c40f');

  const sorted = [...gs.results].sort((a,b)=>a.time-b.time);
  // Add unfinished karts
  const finished = new Set(sorted.map(r=>r.colorIdx));
  gs.karts.filter(k=>!finished.has(k.colorIdx)).forEach((k,i)=>{
    sorted.push({colorIdx:k.colorIdx, time:999999+i, isPlayer:k.isPlayer});
  });

  const medals = ['🥇','🥈','🥉','  '];
  sorted.forEach((r, idx) => {
    const y = 170 + idx*80;
    const isP = r.isPlayer;
    drawRoundedRect(W/2-260, y, 520, 66, 10,
      isP ? 'rgba(255,230,50,0.15)' : 'rgba(255,255,255,0.06)',
      isP ? '#f1c40f' : 'rgba(255,255,255,0.2)', isP ? 2 : 1);
    // Color swatch
    ctx.fillStyle = KART_COLORS[r.colorIdx];
    ctx.beginPath(); ctx.roundRect(W/2-240, y+14, 36, 36, 6); ctx.fill();
    drawText(medals[idx]||'', W/2-190, y+38, 28, '#fff');
    drawText(KART_NAMES[r.colorIdx] + (isP?' (YOU)':''), W/2-60, y+38, 22, isP?'#f1c40f':'#fff');
    const tStr = r.time < 999000 ? (r.time/1000).toFixed(2)+'s' : 'DNF';
    drawText(tStr, W/2+200, y+38, 20, 'rgba(200,200,200,0.8)');
  });

  const blink = Math.floor(Date.now()/600)%2;
  if (blink) drawText('PRESS ENTER TO PLAY AGAIN', W/2, H-40, 22, '#ffe066');
}

// ═══════════════════════════════════════════════════════════════════════
// RACE SCENE (used by race + countdown)
// ═══════════════════════════════════════════════════════════════════════
function drawRaceScene() {
  const map = gs.map;
  const camX = gs.camera.x, camY = gs.camera.y;
  drawTrack(map, camX, camY);
  drawItemBoxes(camX, camY);
  drawProjectilesAndBananas(camX, camY);
  drawParticles(camX, camY);

  // Sort karts: draw airborne last (on top)
  const sortedKarts = [...gs.karts].sort((a,b) => a.jumpZ - b.jumpZ);
  for (const k of sortedKarts) {
    if (k.invincTimer > 0 && Math.floor(Date.now()/80)%2===0) continue;
    drawKart(k, camX, camY);
  }
  drawTunnelOverlay();
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN DRAW
// ═══════════════════════════════════════════════════════════════════════
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';

  if (gs.screen === 'title') {
    drawTitle();
  } else if (gs.screen === 'mapselect') {
    drawMapSelect();
  } else if (gs.screen === 'select') {
    drawKartSelect();
  } else if (gs.screen === 'countdown') {
    drawCountdown();
  } else if (gs.screen === 'race') {
    drawRaceScene();
    drawHUD();
  } else if (gs.screen === 'results') {
    drawResults();
  }
}

// ═══════════════════════════════════════════════════════════════════════
// PLAYER ITEM USE VIA SPACE KEY
// ═══════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && gs.screen === 'race') {
    const pk = gs.karts[0];
    // Space is overloaded: drift (held) + item use (tap when not turning)
    const lt = gs.keys['ArrowLeft'] || gs.keys['KeyA'];
    const rt = gs.keys['ArrowRight']|| gs.keys['KeyD'];
    if (!lt && !rt && pk.item && !pk.drifting) {
      useItem(pk);
    }
  }
});

// ═══════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════
initState();
initTitleKarts();
// Generate stars for bg screens
gs.stars = Array.from({length:120}, ()=>({
  x: Math.random()*W, y: Math.random()*H,
  r: Math.random()*1.5+0.3,
  twinkle: Math.random()*Math.PI*2,
}));
requestAnimationFrame(update);
</script>
</body>
</html>
