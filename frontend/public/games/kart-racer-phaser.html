<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kart Racer Pro</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
</style>

<body>
<script>
'use strict';

// ═══════════════════════════════════════════════════════
//  GLOBAL CONFIG  (all speeds in world-px / second)
// ═══════════════════════════════════════════════════════
const W=960, H=640, WORLD_W=5000, WORLD_H=4200;
const TRACK_W=210;      // road width
const TOTAL_LAPS=3, NUM_AI=5;

// spd = max speed (px/s), acc = acceleration (px/s²),
// brake = brake decel (px/s²), hdl = turn rate (rad/s)
const CAR_DEFS=[
  {name:'Speeder', spd:490,acc:680,brake:900,hdl:2.9,col:0xe74c3c,hex:'#e74c3c'},
  {name:'Bruiser', spd:460,acc:420,brake:700,hdl:2.1,col:0x3498db,hex:'#3498db'},
  {name:'Drifter', spd:470,acc:560,brake:800,hdl:3.3,col:0x2ecc71,hex:'#2ecc71'},
  {name:'Rocket',  spd:530,acc:310,brake:620,hdl:1.8,col:0xf39c12,hex:'#f39c12'},
  {name:'Nimble',  spd:410,acc:820,brake:1100,hdl:3.9,col:0x9b59b6,hex:'#9b59b6'},
  {name:'Steady',  spd:465,acc:500,brake:780,hdl:2.5,col:0x1abc9c,hex:'#1abc9c'},
];

const ITEM_TABLE={
  mushroom:[30,10], triple_mushroom:[8,18], green_shell:[20,15],
  red_shell:[4,20], banana:[22,10], bomb:[4,12],
  star:[2,10], lightning:[3,10], shield:[22,15],
};
const ITEM_ICONS={
  mushroom:'🍄',triple_mushroom:'🍄×3',green_shell:'🟢',red_shell:'🔴',
  banana:'🍌',bomb:'💣',star:'⭐',lightning:'⚡',shield:'🛡️'
};
const POINTS=[15,12,10,8,6,3];

// ═══════════════════════════════════════════════════════
//  AUDIO  (Web Audio API, no external files needed)
// ═══════════════════════════════════════════════════════
let _ac=null;
const ac=()=>{if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;};
function tone(freq,dur,type='sine',vol=0.3,ramp=true){
  try{
    const a=ac(),o=a.createOscillator(),g=a.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,a.currentTime);
    if(ramp)g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur+0.02);
  }catch(e){}
}
const sfxBeep=(go)=>go?tone(880,0.2,'sine',0.5):tone(440,0.12,'sine',0.4);
function sfxBoost(){tone(180,0.06,'sawtooth',0.2);setTimeout(()=>tone(380,0.14,'sawtooth',0.2),70);}
const sfxHit=()=>tone(100,0.35,'sawtooth',0.4);
function sfxItem(){tone(660,0.07,'sine',0.25);setTimeout(()=>tone(990,0.12,'sine',0.25),100);}

// ═══════════════════════════════════════════════════════
//  MATH
// ═══════════════════════════════════════════════════════
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function normAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  if(l2===0)return{x:ax,y:ay,t:0,d:dist(px,py,ax,ay)};
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);
  const cx=ax+t*dx,cy=ay+t*dy;
  return{x:cx,y:cy,t,d:dist(px,py,cx,cy)};
}
// Catmull-Rom spline through closed loop of pts
function catmull(pts,seg=20){
  const n=pts.length,out=[];
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    for(let j=0;j<seg;j++){
      const t=j/seg,t2=t*t,t3=t2*t;
      out.push({
        x:.5*((-p0.x+3*p1.x-3*p2.x+p3.x)*t3+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+p2.x)*t+2*p1.x),
        y:.5*((-p0.y+3*p1.y-3*p2.y+p3.y)*t3+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+p2.y)*t+2*p1.y),
      });
    }
  }
  out.push({...out[0]});
  return out;
}

// ═══════════════════════════════════════════════════════
//  TRACK  — 20-control-point interesting circuit
//  World 5000×4200. Sections:
//   Bottom: long start/finish straight  → right
//   Right : sweeping banked turn up the side
//   Top-R : tight hairpin bending back left
//   Top   : flat-out blast + chicane
//   Top-L : another tight hairpin
//   Left  : long gentle straight back south
//   Bottom-L: wide sweeping corner home
// ═══════════════════════════════════════════════════════
const RAW=[
  {x:900,  y:3800},  //  0  START  ─ bottom straight begins
  {x:1700, y:3800},  //  1
  {x:2500, y:3800},  //  2
  {x:3300, y:3800},  //  3  ─ sweeping right turn
  {x:3900, y:3600},  //  4
  {x:4300, y:3200},  //  5
  {x:4500, y:2700},  //  6  ─ right-side straight going up
  {x:4500, y:2100},  //  7
  {x:4300, y:1600},  //  8  ─ top-right hairpin
  {x:3900, y:1250},  //  9
  {x:3400, y:1050},  // 10  ─ top straight
  {x:2900, y:850},   // 11
  {x:2400, y:700},   // 12  ─ PEAK (chicane high point)
  {x:1900, y:850},   // 13
  {x:1500, y:1150},  // 14  ─ top-left hairpin
  {x:1250, y:1550},  // 15
  {x:1150, y:2050},  // 16  ─ left-side straight
  {x:1150, y:2600},  // 17
  {x:1000, y:3100},  // 18  ─ bottom-left sweeping corner
  {x:900,  y:3450},  // 19
];

class Track{
  constructor(){
    this.spine=catmull(RAW,20);
    // arc-length table
    this.arc=[0];
    for(let i=1;i<this.spine.length;i++){
      const dx=this.spine[i].x-this.spine[i-1].x,dy=this.spine[i].y-this.spine[i-1].y;
      this.arc.push(this.arc[i-1]+Math.sqrt(dx*dx+dy*dy));
    }
    this.totalLen=this.arc[this.arc.length-1];
    this.hw=TRACK_W/2;
    this.boostPadProgs=[0.10,0.37,0.60,0.83]; // normalized progress of boost pads
  }

  // Returns {onRoad, d, prog, si} — si is segment index hint for next call
  query(px,py,hint=0){
    let best=1e9,bi=0,bp=null;
    const n=this.spine.length-1;
    // local search around hint first
    const lo=Math.max(0,hint-30),hi=Math.min(n-1,hint+30);
    for(let i=lo;i<hi;i++){
      const r=closestOnSeg(px,py,this.spine[i].x,this.spine[i].y,this.spine[i+1].x,this.spine[i+1].y);
      if(r.d<best){best=r.d;bi=i;bp=r;}
    }
    if(best>this.hw+60){
      for(let i=0;i<n;i++){
        const r=closestOnSeg(px,py,this.spine[i].x,this.spine[i].y,this.spine[i+1].x,this.spine[i+1].y);
        if(r.d<best){best=r.d;bi=i;bp=r;}
      }
    }
    const prog=(this.arc[bi]+(bp.t*(this.arc[bi+1]-this.arc[bi])))/this.totalLen;
    return{onRoad:best<=this.hw+10,d:best,prog,si:bi};
  }

  // Point + heading at normalized progress t∈[0,1]
  atProg(t){
    const target=t*this.totalLen;
    let i=0;
    while(i<this.arc.length-2&&this.arc[i+1]<target)i++;
    const f=this.arc[i+1]===this.arc[i]?0:(target-this.arc[i])/(this.arc[i+1]-this.arc[i]);
    const a=this.spine[i],b=this.spine[i+1]||this.spine[0];
    return{x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f),ang:Math.atan2(b.y-a.y,b.x-a.x)};
  }

  waypoints(n=60){
    const w=[];
    for(let i=0;i<n;i++)w.push(this.atProg(i/n));
    return w;
  }

  draw(scene){
    const g=scene.add.graphics().setDepth(0);
    const sp=this.spine;

    // ── wide dark asphalt border
    g.lineStyle(TRACK_W+30,0x1a1a1a,1);
    g.beginPath();g.moveTo(sp[0].x,sp[0].y);
    for(let i=1;i<sp.length;i++)g.lineTo(sp[i].x,sp[i].y);
    g.strokePath();

    // ── curbs: alternating red/white every 45 world-units
    let cum=0;
    for(let i=0;i<sp.length-1;i++){
      const dx=sp[i+1].x-sp[i].x,dy=sp[i+1].y-sp[i].y,sl=Math.sqrt(dx*dx+dy*dy);
      const stripe=Math.floor(cum/45)%2;
      g.lineStyle(TRACK_W+14,stripe?0xffffff:0xdd1111,1);
      g.beginPath();g.moveTo(sp[i].x,sp[i].y);g.lineTo(sp[i+1].x,sp[i+1].y);g.strokePath();
      cum+=sl;
    }

    // ── road surface (main asphalt)
    g.lineStyle(TRACK_W,0x6e6e6e,1);
    g.beginPath();g.moveTo(sp[0].x,sp[0].y);
    for(let i=1;i<sp.length;i++)g.lineTo(sp[i].x,sp[i].y);
    g.strokePath();

    // ── road texture variation — slightly lighter strips every ~400 units
    cum=0;
    for(let i=0;i<sp.length-1;i++){
      const dx=sp[i+1].x-sp[i].x,dy=sp[i+1].y-sp[i].y,sl=Math.sqrt(dx*dx+dy*dy);
      if(Math.floor(cum/400)%2===0){
        g.lineStyle(TRACK_W-4,0x757575,1);
        g.beginPath();g.moveTo(sp[i].x,sp[i].y);g.lineTo(sp[i+1].x,sp[i+1].y);g.strokePath();
      }
      cum+=sl;
    }

    // ── center dashes (white, dashed)
    cum=0;
    for(let i=0;i<sp.length-1;i++){
      const dx=sp[i+1].x-sp[i].x,dy=sp[i+1].y-sp[i].y,sl=Math.sqrt(dx*dx+dy*dy);
      if(Math.floor(cum/55)%2===0){
        g.lineStyle(5,0xffffff,0.4);
        g.beginPath();g.moveTo(sp[i].x,sp[i].y);g.lineTo(sp[i+1].x,sp[i+1].y);g.strokePath();
      }
      cum+=sl;
    }

    // ── start / finish checkered line
    const s0=sp[0],s1=sp[1]||sp[0];
    const sfAng=Math.atan2(s1.y-s0.y,s1.x-s0.x)+Math.PI/2;
    const sq=18,cols=Math.floor(TRACK_W/sq)+1;
    for(let row=0;row<2;row++){
      for(let col=0;col<cols;col++){
        const px=s0.x+Math.cos(sfAng)*(col*sq-TRACK_W/2)+Math.cos(sfAng-Math.PI/2)*row*sq;
        const py=s0.y+Math.sin(sfAng)*(col*sq-TRACK_W/2)+Math.sin(sfAng-Math.PI/2)*row*sq;
        g.fillStyle((row+col)%2?0x000000:0xffffff,1);
        g.fillRect(px,py,sq,sq);
      }
    }

    return g;
  }

  drawBoostPads(scene){
    const pads=[];
    for(const t of this.boostPadProgs){
      const pt=this.atProg(t);
      const perp=pt.ang+Math.PI/2;
      // 3 pads across the width
      for(let o=-1;o<=1;o++){
        const bx=pt.x+Math.cos(perp)*o*45,by=pt.y+Math.sin(perp)*o*45;
        const g=scene.add.graphics().setDepth(2);
        g.fillStyle(0x00e5ff,0.9);g.fillRect(-22,-9,44,18);
        g.lineStyle(2,0xffffff,0.9);g.strokeRect(-22,-9,44,18);
        // arrow
        g.fillStyle(0xffffff,0.95);
        g.fillTriangle(-4,-6,14,0,-4,6);
        g.x=bx;g.y=by;g.angle=Phaser.Math.RadToDeg(pt.ang);
        pads.push({x:bx,y:by,g});
      }
    }
    return pads;
  }

  drawScenery(scene){
    // Trees — only off-track
    for(let i=0;i<160;i++){
      const tx=200+Math.random()*(WORLD_W-400);
      const ty=200+Math.random()*(WORLD_H-400);
      if(this.query(tx,ty).d<this.hw+90)continue;
      const g=scene.add.graphics().setDepth(1);
      const r=16+Math.random()*22;
      // trunk
      g.fillStyle(0x5c3d1e,1);g.fillRect(-4,r*0.4,8,18);
      // canopy layers
      g.fillStyle(0x1a5410,1);g.fillCircle(0,r*0.2,r*1.15);
      g.fillStyle(0x246b18,1);g.fillCircle(0,0,r);
      g.fillStyle(0x30821e,1);g.fillCircle(0,-r*0.3,r*0.7);
      g.x=tx;g.y=ty;
    }
    // Grandstands near start/finish
    const sf=this.atProg(0.01);
    const perp=sf.ang+Math.PI/2;
    for(let side=-1;side<=1;side+=2){
      const sx=sf.x+Math.cos(perp)*side*(this.hw+60);
      const sy=sf.y+Math.sin(perp)*side*(this.hw+60);
      const g=scene.add.graphics().setDepth(1);
      g.fillStyle(side<0?0xcc4422:0x2244cc,1);
      g.fillRect(-60,-30,120,50);
      g.fillStyle(0xffffff,0.3);
      for(let r=0;r<3;r++)g.fillRect(-55+r*40,-25,32,10);
      g.x=sx;g.y=sy;g.angle=Phaser.Math.RadToDeg(sf.ang);
    }
  }
}

// ═══════════════════════════════════════════════════════
//  KART BASE  — physics in world-px / second
// ═══════════════════════════════════════════════════════
class Kart{
  constructor(scene,x,y,ang,def,idx){
    this.scene=scene; this.def=def; this.idx=idx;
    this.x=x; this.y=y; this.ang=ang; this.spd=0;

    // race state
    this.totalProg=0; this.lastProg=null; this.lap=0;
    this.position=idx+1; this.finished=false; this.finTime=0;
    this.segHint=0;

    // item/effect state
    this.heldItem=null; this.itemCD=0;
    this.fx={}; // effect name → remaining ms

    // boost
    this.boostT=0;  // ms remaining
    this.boostPow=0; // extra px/s

    // drift — clean state machine
    // state: 'none' | 'drifting'
    this.driftState='none';
    this.driftDir=0;   // -1=left, +1=right
    this.driftQ=0;     // 0-100, sparks charge
    this.driftLv=0;    // 0/1/2 = blue/orange/purple

    // stun / spin
    this.stunT=0; this.spinT=0; this.spinDir=1;
    this.flashT=0; this.kartScale=1;
    this.onRoad=true;

    this._buildGfx();
  }

  _buildGfx(){
    const s=this.scene,c=this.def.col;
    this.ctr=s.add.container(this.x,this.y).setDepth(10+this.idx);

    // shadow
    s.add.ellipse(5,10,56,22,0x000000,0.2).setDepth(0);
    const sh=s.add.ellipse(5,10,56,22,0x000000,0.2);
    this.ctr.add(sh);

    // body
    const b=s.add.graphics();
    b.fillStyle(c,1);
    b.fillRoundedRect(-24,-12,48,24,6);
    // cockpit
    b.fillStyle(0x111122,0.95);
    b.fillRect(-5,-10,18,12);
    // windshield glint
    b.fillStyle(0x88ccff,0.4);
    b.fillRect(-3,-9,14,5);
    // front spoiler
    b.fillStyle(0x111,1);
    b.fillRect(20,-4,6,8);
    // rear diffuser
    b.fillStyle(0x333,1);
    b.fillRect(-26,-7,5,14);
    // exhaust pipes
    b.fillStyle(0x888,1);
    b.fillRect(-26,-10,4,4);
    b.fillRect(-26,6,4,4);
    this.ctr.add(b);

    // wheels (4)
    for(const[ox,oy,fw] of[[-13,-14,false],[11,-14,true],[-13,9,false],[11,9,true]]){
      const w=s.add.graphics();
      w.fillStyle(0x111,1);w.fillRoundedRect(-5,-4,10,9,2);
      w.fillStyle(0x555,1);w.fillCircle(0,0.5,2.5);
      if(fw){w.fillStyle(c,0.6);w.fillRect(-5,-4,2,9);}
      w.x=ox;w.y=oy;
      this.ctr.add(w);
    }

    // name tag
    const nt=s.add.text(0,-28,this.def.name,{fontSize:'10px',fill:'#fff',stroke:'#000',strokeThickness:2,fontStyle:'bold'}).setOrigin(0.5,1);
    this.ctr.add(nt);

    // drift sparks container
    this.sparkGfx=s.add.graphics();
    this.ctr.add(this.sparkGfx);

    // boost flame
    this.flameGfx=s.add.graphics();
    this.ctr.add(this.flameGfx);

    // star glow
    this.glowGfx=s.add.graphics();
    this.ctr.add(this.glowGfx);

    // shield ring
    this.shieldGfx=s.add.graphics();
    this.ctr.add(this.shieldGfx);
  }

  get maxSpd(){
    let s=this.def.spd;
    if(this.boostT>0)s+=this.boostPow;
    if(this.fx.star)s+=180;
    if(this.fx.lightning)s*=0.45;
    return s;
  }

  update(dt,track,karts,items){
    if(this.finished)return;
    const s=dt/1000; // seconds

    // timers
    if(this.stunT>0){this.stunT-=dt;this.spd*=Math.pow(0.6,s);}
    if(this.spinT>0){this.spinT-=dt;this.ang+=this.spinDir*10*s;}
    if(this.boostT>0)this.boostT-=dt;else this.boostPow=0;
    if(this.flashT>0)this.flashT-=dt;
    if(this.itemCD>0)this.itemCD-=dt;
    for(const k of Object.keys(this.fx)){this.fx[k]-=dt;if(this.fx[k]<=0)delete this.fx[k];}

    // sub-class driving logic
    if(this.stunT<=0&&this.spinT<=0) this.drive(s,track,karts,items);

    // off-road detection
    const q=track.query(this.x,this.y,this.segHint);
    this.onRoad=q.onRoad; this.segHint=q.si;

    // off-road speed cap (not a harsh wall, a soft cap that squeezes)
    if(!this.onRoad){
      const offMax=this.def.spd*0.52;
      if(this.spd>offMax)this.spd-=(this.spd-offMax)*Math.min(5*s,1);
      if(this.spd<-offMax*0.4)this.spd+=(Math.abs(this.spd)-offMax*0.4)*Math.min(5*s,1);
    }

    // global speed clamp
    const mx=this.maxSpd;
    this.spd=clamp(this.spd,-mx*0.4,mx);

    // move (px/s)
    this.x+=Math.cos(this.ang)*this.spd*s;
    this.y+=Math.sin(this.ang)*this.spd*s;
    this.x=clamp(this.x,60,WORLD_W-60);
    this.y=clamp(this.y,60,WORLD_H-60);

    // kart-kart soft push
    for(const o of karts){
      if(o===this)continue;
      const dx=this.x-o.x,dy=this.y-o.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<42&&d>0.5){
        const push=(42-d)/42*3;
        this.x+=(dx/d)*push*0.5; this.y+=(dy/d)*push*0.5;
        this.spd*=1-push*0.012;
      }
    }

    // lap tracking (monotonic progress — handles wrap-around cleanly)
    const newProg=q.prog;
    if(this.lastProg===null)this.lastProg=newProg;
    let delta=newProg-this.lastProg;
    if(delta<-0.5)delta+=1;   // crossed start going forward
    if(delta>0.5) delta-=1;   // crossed start going backward
    this.totalProg+=delta;
    this.lastProg=newProg;

    if(Math.floor(this.totalProg)>this.lap){
      this.lap=Math.floor(this.totalProg);
      if(this.lap>=TOTAL_LAPS&&!this.finished){
        this.finished=true;
        this.finTime=this.scene.rm?.raceTimer||0;
      }
    }

    // visual update
    this.ctr.x=this.x; this.ctr.y=this.y;
    this.ctr.rotation=this.ang;
    const tgtScale=this.fx.lightning?0.5:1;
    this.kartScale=lerp(this.kartScale,tgtScale,0.1);
    this.ctr.setScale(this.kartScale);
    // hit flash
    this.ctr.setAlpha(this.flashT>0&&Math.floor(this.flashT/100)%2?0.2:1);

    this._drawSparks();
    this._drawFlame();
    this._drawGlow();
    this._drawShield();
  }

  drive(){}  // override

  // ── drift boost on release
  applyDriftBoost(){
    if(this.driftQ>=75){this.boostT=1800;this.boostPow=220;sfxBoost();}
    else if(this.driftQ>=42){this.boostT=1000;this.boostPow=150;sfxBoost();}
    else if(this.driftQ>=18){this.boostT=450;this.boostPow=90;}
    this.driftQ=0;this.driftLv=0;this.driftState='none';
  }

  hit(src){
    if(this.fx.star||this.fx.shield){delete this.fx.shield;return;}
    sfxHit();
    this.stunT=1200; this.spinT=700;
    this.spinDir=Math.random()<0.5?1:-1;
    this.flashT=1400; this.spd*=-0.2;
    this.heldItem=null;
    if(this.driftState==='drifting'){this.driftQ=0;this.driftState='none';}
  }

  _drawSparks(){
    this.sparkGfx.clear();
    if(this.driftState!=='drifting'||this.driftQ<10)return;
    const cols=[0x44aaff,0xff8800,0xaa00ff];
    const col=cols[this.driftLv];
    for(let i=0;i<5;i++){
      this.sparkGfx.fillStyle(col,0.4+Math.random()*0.6);
      const side=this.driftDir>0?1:-1;
      const ox=-16+side*6+Math.random()*10;
      const oy=9+Math.random()*10;
      this.sparkGfx.fillRect(ox,oy,3+Math.random()*5,2+Math.random()*4);
    }
  }
  _drawFlame(){
    this.flameGfx.clear();
    if(this.boostT<=0)return;
    const sz=1+Math.random()*0.5;
    this.flameGfx.fillStyle(0xff6600,0.9);
    this.flameGfx.fillTriangle(-25,-8*sz,-25,8*sz,-40-Math.random()*8,0);
    this.flameGfx.fillStyle(0xffee00,0.75);
    this.flameGfx.fillTriangle(-25,-4*sz,-25,4*sz,-34-Math.random()*5,0);
  }
  _drawGlow(){
    this.glowGfx.clear();
    if(!this.fx.star)return;
    this.glowGfx.setAlpha(0.45+Math.sin(Date.now()/70)*0.3);
    this.glowGfx.fillStyle(0xffff33,0.5);
    this.glowGfx.fillCircle(0,0,34);
  }
  _drawShield(){
    this.shieldGfx.clear();
    if(!this.fx.shield)return;
    this.shieldGfx.lineStyle(3,0x44aaff,0.7+Math.sin(Date.now()/60)*0.2);
    this.shieldGfx.strokeCircle(0,0,32);
  }

  destroy(){this.ctr.destroy();}
}

// ═══════════════════════════════════════════════════════
//  PLAYER KART
// ═══════════════════════════════════════════════════════
class PlayerKart extends Kart{
  constructor(scene,x,y,ang,def){
    super(scene,x,y,ang,def,0);
    this.keys=scene.input.keyboard.addKeys({
      up:    Phaser.Input.Keyboard.KeyCodes.UP,
      dn:    Phaser.Input.Keyboard.KeyCodes.DOWN,
      lt:    Phaser.Input.Keyboard.KeyCodes.LEFT,
      rt:    Phaser.Input.Keyboard.KeyCodes.RIGHT,
      w:     Phaser.Input.Keyboard.KeyCodes.W,
      s:     Phaser.Input.Keyboard.KeyCodes.S,
      a:     Phaser.Input.Keyboard.KeyCodes.A,
      d:     Phaser.Input.Keyboard.KeyCodes.D,
      drift: Phaser.Input.Keyboard.KeyCodes.SHIFT,
      item:  Phaser.Input.Keyboard.KeyCodes.Z,
      item2: Phaser.Input.Keyboard.KeyCodes.SPACE,
    });
  }

  drive(s,track,karts,items){
    const k=this.keys;
    const up=k.up.isDown||k.w.isDown;
    const dn=k.dn.isDown||k.s.isDown;
    const lt=k.lt.isDown||k.a.isDown;
    const rt=k.rt.isDown||k.d.isDown;
    const dr=k.drift.isDown;

    // ── ACCELERATION  (px/s²)
    if(up){
      // When pressing gas, almost no friction so kart accelerates to maxSpd cleanly
      const gap=this.maxSpd-this.spd;
      this.spd+=Math.min(this.def.acc*s, gap>0?gap:0);
      // micro-friction to prevent exceeding maxSpd
      if(this.spd>this.maxSpd)this.spd=this.maxSpd;
    } else if(dn){
      if(this.spd>10) this.spd-=this.def.brake*s;
      else this.spd=Math.max(this.spd-this.def.acc*0.5*s,-this.maxSpd*0.35);
    } else {
      // Coast: exponential decay toward 0
      const coast=Math.pow(0.12,s); // ~88% speed loss per second while coasting
      this.spd*=coast;
      if(Math.abs(this.spd)<8)this.spd=0;
    }

    // ── TURNING  (rad/s, speed-scaled so slow turns are tighter)
    const speedRatio=clamp(Math.abs(this.spd)/this.def.spd,0.15,1.2);
    const turnRate=this.def.hdl*speedRatio;

    if(this.driftState==='none'){
      const sign=this.spd>=0?1:-1;
      if(lt)this.ang-=turnRate*s*sign;
      if(rt)this.ang+=turnRate*s*sign;
    }

    // ── DRIFT STATE MACHINE
    // Entry: SHIFT + direction + speed > 140 px/s
    if(this.driftState==='none'&&dr&&(lt||rt)&&this.spd>140){
      this.driftState='drifting';
      this.driftDir=lt?-1:1;
      this.driftQ=0; this.driftLv=0;
    }

    if(this.driftState==='drifting'){
      // Wider drift turning
      const dRate=this.def.hdl*1.55;
      if(lt)this.ang-=dRate*s;
      if(rt)this.ang+=dRate*s;
      // Counter-steer pull (kart drifts outward, feels like sliding)
      this.ang+=this.driftDir*this.def.hdl*0.48*s;

      // Charge accumulates while pressing up+drift+turning
      if(up&&(lt||rt)){
        this.driftQ=Math.min(100,this.driftQ+88*s);
        this.driftLv=this.driftQ>=72?2:this.driftQ>=38?1:0;
      }

      // Exit drift: release SHIFT  OR  speed drops too low
      if(!dr||this.spd<80){
        this.applyDriftBoost();  // sets driftState='none'
      }
    }

    // ── ITEM USE
    if((Phaser.Input.Keyboard.JustDown(k.item)||Phaser.Input.Keyboard.JustDown(k.item2))
        &&this.heldItem&&this.itemCD<=0){
      items.use(this,this.heldItem,karts);
      this.heldItem=null; this.itemCD=500;
    }

    // ── SLIPSTREAM  (draft behind close kart = small boost)
    for(const o of karts){
      if(o===this)continue;
      const dx=o.x-this.x,dy=o.y-this.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>15&&d<150){
        const ahead=Math.cos(this.ang)*dx+Math.sin(this.ang)*dy;
        if(ahead>50){
          if(!this.fx.slip)this.fx.slip=0;
          this.fx.slip+=dt;
          if(this.fx.slip>900&&this.boostT<=0){
            this.boostT=700; this.boostPow=100;
          }
        }
      }
    }
  }
}

// ═══════════════════════════════════════════════════════
//  AI KART
// ═══════════════════════════════════════════════════════
class AIKart extends Kart{
  constructor(scene,x,y,ang,def,aiIdx,wps){
    super(scene,x,y,ang,def,aiIdx+1);
    this.wps=wps;
    this.wpIdx=aiIdx*3;  // stagger starting waypoints
    this.skill=0.58+aiIdx*0.09;  // 0.58→1.03 (last AI almost full speed)
    this.itemT=1500+Math.random()*3000;
  }

  drive(s,track,karts,items){
    const wp=this.wps[this.wpIdx%this.wps.length];
    const dx=wp.x-this.x,dy=wp.y-this.y,dToWP=Math.sqrt(dx*dx+dy*dy);
    if(dToWP<85)this.wpIdx=(this.wpIdx+1)%this.wps.length;

    // steer
    const target=Math.atan2(dy,dx);
    const diff=normAngle(target-this.ang);
    const sr=clamp(Math.abs(this.spd)/this.def.spd,0.2,1.2);
    const maxTurn=this.def.hdl*sr*s;
    this.ang+=clamp(diff,-maxTurn,maxTurn);

    // rubber-band speed: back of pack gets a boost, front gets slight penalty
    const behind=this.position>3;
    const rb=behind?1.14:(this.position===1?0.91:1.0);
    const topSpd=this.def.spd*this.skill*rb*(this.onRoad?1:0.54);

    // acceleration toward target speed
    const spdDiff=topSpd-this.spd;
    this.spd+=clamp(spdDiff*4*s,-this.def.brake*s,this.def.acc*s);

    // AI drifts on tight corners
    if(this.driftState==='none'&&Math.abs(diff)>0.65&&this.spd>160){
      this.driftState='drifting';
      this.driftDir=diff>0?1:-1;
      this.driftQ=0;
    }
    if(this.driftState==='drifting'){
      this.driftQ+=70*s;
      if(this.driftQ>55||Math.abs(diff)<0.18)this.applyDriftBoost();
    }

    // use item
    this.itemT-=s*1000;
    if(this.itemT<=0&&this.heldItem&&this.itemCD<=0){
      this.itemT=2000+Math.random()*3000;
      items.use(this,this.heldItem,karts);
      this.heldItem=null; this.itemCD=500;
    }
  }
}

// ═══════════════════════════════════════════════════════
//  PROJECTILE
// ═══════════════════════════════════════════════════════
class Proj{
  constructor(scene,x,y,ang,type,owner){
    this.scene=scene;this.x=x;this.y=y;this.ang=ang;
    this.type=type;this.owner=owner;this.alive=true;
    this.spd=type==='banana'?0:520; // px/s
    this.bounces=type==='green_shell'?3:0;
    this.life=type==='banana'?28000:5500;

    const pal={green_shell:0x2ecc71,red_shell:0xe74c3c,banana:0xf1c40f,bomb:0x333333};
    this.gfx=scene.add.graphics().setDepth(8);
    if(type==='banana'){
      this.gfx.fillStyle(0xf1c40f,1);this.gfx.fillEllipse(0,0,24,14);
      this.gfx.fillStyle(0xcc9900,1);this.gfx.fillEllipse(0,0,18,8);
    }else if(type==='bomb'){
      this.gfx.fillStyle(0x222,1);this.gfx.fillCircle(0,0,14);
      this.gfx.fillStyle(0xff0000,1);this.gfx.fillCircle(5,-10,4);
    }else{
      this.gfx.fillStyle(pal[type]||0xfff,1);this.gfx.fillCircle(0,0,10);
      this.gfx.lineStyle(2,0xffffff,0.7);this.gfx.strokeCircle(0,0,10);
    }
    this.gfx.x=x;this.gfx.y=y;
  }

  update(s,track,karts){
    if(!this.alive)return;
    this.life-=s*1000; if(this.life<=0){this.destroy();return;}

    if(this.type==='banana'){
      for(const k of karts){
        if(k===this.owner)continue;
        if(dist(this.x,this.y,k.x,k.y)<26){k.hit('banana');this.destroy();return;}
      }
      return;
    }

    // homing red shell
    if(this.type==='red_shell'){
      let target=null,best=1e9;
      for(const k of karts){
        if(k===this.owner||k.finished)continue;
        const d=dist(this.x,this.y,k.x,k.y);
        if(d<best){best=d;target=k;}
      }
      if(target){
        const ta=Math.atan2(target.y-this.y,target.x-this.x);
        this.ang=normAngle(lerp(this.ang,ta,0.11));
      }
    }

    this.x+=Math.cos(this.ang)*this.spd*s;
    this.y+=Math.sin(this.ang)*this.spd*s;

    // green shell bounces off-road edges
    if(this.type==='green_shell'&&!track.query(this.x,this.y).onRoad){
      if(this.bounces-->0){this.ang=normAngle(this.ang+Math.PI*(0.5+Math.random()));}
      else{this.destroy();return;}
    }

    // hit karts
    for(const k of karts){
      if(k===this.owner&&this.life>5000)continue;
      if(dist(this.x,this.y,k.x,k.y)<32){
        k.hit(this.type);
        if(this.type==='bomb'){
          for(const k2 of karts)if(dist(this.x,this.y,k2.x,k2.y)<100)k2.hit('explosion');
          this._explode();
        }
        this.destroy(); return;
      }
    }

    this.gfx.x=this.x;this.gfx.y=this.y;
    this.gfx.angle+=(this.type==='green_shell'?5:this.type==='banana'?3:0);
  }

  _explode(){
    const g=this.scene.add.graphics().setDepth(20);
    g.fillStyle(0xff8800,0.85);g.fillCircle(0,0,70);
    g.fillStyle(0xff4400,0.6);g.fillCircle(0,0,40);
    g.x=this.x;g.y=this.y;
    this.scene.tweens.add({targets:g,alpha:0,scaleX:2.5,scaleY:2.5,duration:450,onComplete:()=>g.destroy()});
  }

  destroy(){this.alive=false;this.gfx.destroy();}
}

// ═══════════════════════════════════════════════════════
//  ITEM SYSTEM
// ═══════════════════════════════════════════════════════
class ItemSystem{
  constructor(scene,track){
    this.scene=scene;this.track=track;
    this.boxes=[];this.projs=[];
    this._spawn();
  }

  _spawn(){
    const n=28;
    for(let i=0;i<n;i++){
      const t=i/n;
      const pt=this.track.atProg(t);
      const perp=pt.ang+Math.PI/2;
      const off=((i%3)-1)*50;
      this._mkBox(pt.x+Math.cos(perp)*off,pt.y+Math.sin(perp)*off);
    }
  }

  _mkBox(x,y){
    const g=this.scene.add.graphics().setDepth(5);
    g.fillStyle(0xffd700,1);g.fillRect(-15,-15,30,30);
    g.fillStyle(0xff3300,1);g.fillRect(-11,-2,22,4);g.fillRect(-2,-11,4,22);
    g.lineStyle(2.5,0xffffff,0.95);g.strokeRect(-15,-15,30,30);
    // shine
    g.fillStyle(0xffffff,0.4);g.fillRect(-13,-13,8,8);
    g.x=x;g.y=y;
    this.scene.tweens.add({targets:g,angle:360,duration:1600,repeat:-1,ease:'Linear'});
    this.boxes.push({x,y,g,on:true,cd:0});
  }

  _pick(pos,total){
    const isFront=pos<=total/2;
    const pool=Object.entries(ITEM_TABLE).map(([n,w])=>({n,w:w[isFront?0:1]}));
    const sum=pool.reduce((a,e)=>a+e.w,0);
    let r=Math.random()*sum;
    for(const e of pool){r-=e.w;if(r<=0)return e.n;}
    return 'mushroom';
  }

  checkBoxes(karts){
    for(const b of this.boxes){
      if(!b.on){b.cd-=16;if(b.cd<=0){b.on=true;b.g.setVisible(true);}continue;}
      for(const k of karts){
        if(k.heldItem)continue;
        if(dist(k.x,k.y,b.x,b.y)<32){
          k.heldItem={type:this._pick(k.position,karts.length)};
          sfxItem();b.on=false;b.cd=7500;b.g.setVisible(false);break;
        }
      }
    }
  }

  use(kart,item,karts){
    const t=item.type;
    const fa=kart.ang;
    const ax=kart.x+Math.cos(fa)*44,ay=kart.y+Math.sin(fa)*44;
    const bx=kart.x-Math.cos(fa)*44,by=kart.y-Math.sin(fa)*44;
    switch(t){
      case 'mushroom':     kart.boostT=1600;kart.boostPow=190;sfxBoost();break;
      case 'triple_mushroom':kart.boostT=4800;kart.boostPow=170;sfxBoost();break;
      case 'green_shell':  this.projs.push(new Proj(this.scene,ax,ay,fa,'green_shell',kart));break;
      case 'red_shell':    this.projs.push(new Proj(this.scene,ax,ay,fa,'red_shell',kart));break;
      case 'banana':       this.projs.push(new Proj(this.scene,bx,by,fa,'banana',kart));break;
      case 'bomb':         this.projs.push(new Proj(this.scene,ax,ay,fa,'bomb',kart));break;
      case 'star':         kart.fx.star=9000;kart.boostT=9000;kart.boostPow=180;sfxBoost();break;
      case 'lightning':
        for(const k of karts)if(k!==kart){k.fx.lightning=5000;k.hit('lightning');}
        break;
      case 'shield':       kart.fx.shield=6000;sfxItem();break;
    }
  }

  update(s,track,karts){
    this.checkBoxes(karts);
    for(const p of this.projs)p.update(s,track,karts);
    this.projs=this.projs.filter(p=>p.alive);
  }

  destroy(){
    for(const b of this.boxes)b.g.destroy();
    for(const p of this.projs)p.destroy();
  }
}

// ═══════════════════════════════════════════════════════
//  RACE MANAGER
// ═══════════════════════════════════════════════════════
class RaceManager{
  constructor(karts,track){
    this.karts=karts;this.track=track;
    this.started=false;this.finished=false;
    this.countdown=3;this.cdTimer=0;this.raceTimer=0;
    this.finishOrder=[];
  }

  update(dt){
    if(this.finished)return;

    if(!this.started){
      this.cdTimer+=dt;
      if(this.cdTimer>=1000){
        this.cdTimer-=1000;
        this.countdown--;
        sfxBeep(this.countdown<0);
        if(this.countdown<0)this.started=true;
      }
      return;
    }

    this.raceTimer+=dt;

    // update positions among non-finished karts
    const alive=this.karts.filter(k=>!k.finished);
    alive.sort((a,b)=>(b.totalProg+b.lap)-(a.totalProg+a.lap));
    for(let i=0;i<alive.length;i++)alive[i].position=this.finishOrder.length+i+1;

    // check new finishes
    for(const k of alive){
      if(k.finished&&!this.finishOrder.includes(k)){
        this.finishOrder.push(k);
        k.position=this.finishOrder.length;
        k.finTime=this.raceTimer;
      }
    }

    if(this.karts.every(k=>k.finished))this.finished=true;
    // auto-end 7s after player finishes
    if(this.karts[0].finished&&!this.finished&&this.raceTimer>this.karts[0].finTime+7000)
      this.finished=true;
  }
}

// ═══════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════
class HUD{
  constructor(scene,player,karts,rm,track){
    this.scene=scene;this.player=player;this.karts=karts;this.rm=rm;this.track=track;

    const T=(x,y,t,style,depth=100)=>
      scene.add.text(x,y,t,style).setScrollFactor(0).setDepth(depth);
    const R=(x,y,w,h,c,a)=>
      scene.add.rectangle(x,y,w,h,c,a).setScrollFactor(0).setDepth(99);

    this.posTx=T(W-16,16,'1ST',{fontSize:'54px',fill:'#f1c40f',fontStyle:'bold',stroke:'#000',strokeThickness:6}).setOrigin(1,0);
    this.lapTx=T(W/2,16,'LAP 1/3',{fontSize:'26px',fill:'#fff',fontStyle:'bold',stroke:'#000',strokeThickness:3}).setOrigin(0.5,0);
    this.spdTx=T(W-16,H-16,'0 km/h',{fontSize:'19px',fill:'#fff',stroke:'#000',strokeThickness:2}).setOrigin(1,1);
    this.timeTx=T(W/2,50,'0:00.000',{fontSize:'16px',fill:'#aaa',stroke:'#000',strokeThickness:2}).setOrigin(0.5,0);

    this.cdTx=T(W/2,H/2-70,'',{fontSize:'140px',fill:'#fff',fontStyle:'bold',stroke:'#e00',strokeThickness:12}).setOrigin(0.5).setDepth(200);
    this.finTx=T(W/2,H/2+50,'',{fontSize:'34px',fill:'#f1c40f',fontStyle:'bold',stroke:'#000',strokeThickness:5}).setOrigin(0.5).setVisible(false).setDepth(200);

    // item slot
    R(72,H-72,74,74,0x000000,0.7);
    R(72,H-72,74,74,0,0).setStrokeStyle(2,0xaaaaaa,0.5).setScrollFactor(0).setDepth(99);
    this.itemTx=T(72,H-72,'',{fontSize:'34px'}).setOrigin(0.5).setDepth(101);
    this.fxTx=T(130,H-72,'',{fontSize:'20px'}).setOrigin(0,0.5).setDepth(101);

    // drift bar bg
    R(W/2,H-18,164,12,0x000000,0.65);
    this.driftBar=scene.add.graphics().setScrollFactor(0).setDepth(100);

    // minimap
    this.mmW=170;this.mmH=142;
    this.mmX=W-this.mmW/2-12;this.mmY=H-this.mmH/2-12;
    R(this.mmX,this.mmY,this.mmW+10,this.mmH+10,0x000000,0.8);
    this.mmGfx=scene.add.graphics().setScrollFactor(0).setDepth(100);

    // leaderboard
    this.rankTx=[];
    for(let i=0;i<karts.length;i++){
      this.rankTx.push(T(W-16,108+i*22,'',{fontSize:'13px',fill:'#fff',stroke:'#000',strokeThickness:2}).setOrigin(1,0));
    }
  }

  update(){
    const p=this.player,rm=this.rm;

    // countdown / GO!
    if(!rm.started){
      this.cdTx.setText(rm.countdown>0?String(rm.countdown):'').setVisible(true);
    }else if(rm.raceTimer<1100){
      this.cdTx.setText('GO!').setVisible(true);
    }else{
      this.cdTx.setVisible(false);
    }

    // finish banner
    if(p.finished){
      const pos=['1ST','2ND','3RD','4TH','5TH','6TH'][p.position-1]||`${p.position}TH`;
      this.finTx.setText(`YOU FINISHED ${pos}!`).setVisible(true);
    }

    // position badge
    const posStr=['1ST','2ND','3RD','4TH','5TH','6TH'][p.position-1]||`${p.position}TH`;
    const posCol=['#f1c40f','#c0c0c0','#cd7f32','#fff','#fff','#fff'][p.position-1]||'#fff';
    this.posTx.setText(posStr).setColor(posCol);

    // lap
    this.lapTx.setText(`LAP ${Math.min(p.lap+1,TOTAL_LAPS)}/${TOTAL_LAPS}`);

    // speed (convert px/s → km/h display)
    this.spdTx.setText(`${Math.abs(Math.round(p.spd*0.21))} km/h`);

    // race clock
    if(rm.started){
      const t=rm.raceTimer;
      const m=Math.floor(t/60000),s2=Math.floor((t%60000)/1000),ms=t%1000;
      this.timeTx.setText(`${m}:${String(s2).padStart(2,'0')}.${String(ms).padStart(3,'0')}`);
    }

    // item
    this.itemTx.setText(p.heldItem?ITEM_ICONS[p.heldItem.type]||'?':'');

    // active effects
    const ef=(p.fx.star?'⭐':'')+(p.fx.shield?'🛡️':'')+(p.fx.lightning?'⚡':'');
    this.fxTx.setText(ef);

    // drift charge bar
    this.driftBar.clear();
    if(p.driftState==='drifting'&&p.driftQ>0){
      const bx=W/2-80,by=H-24,bw=160,bh=10;
      const col=[0x44aaff,0xff8800,0xaa00ff][p.driftLv]||0x44aaff;
      this.driftBar.fillStyle(col,1);
      this.driftBar.fillRect(bx,by,bw*Math.min(p.driftQ/100,1),bh);
    }

    // minimap
    this._minimap();

    // leaderboard
    const sorted=[...this.karts].sort((a,b)=>a.position-b.position);
    for(let i=0;i<this.rankTx.length;i++){
      const k=sorted[i];
      if(!k){this.rankTx[i].setText('');continue;}
      const ps=['1ST','2ND','3RD','4TH','5TH','6TH'][i]||`${i+1}`;
      this.rankTx[i].setText(`${ps} ${k.def.name}`).setColor(k===this.player?'#f1c40f':'#ddd');
    }
  }

  _minimap(){
    const g=this.mmGfx;g.clear();
    const mx=this.mmX,my=this.mmY,mw=this.mmW,mh=this.mmH;
    // track bounds  (approx from RAW)
    const pad=200;
    const bx=900-pad,by=700-pad,bw=WORLD_W-(900-pad)*2+200,bh=WORLD_H-(700-pad)*2+200;
    const sx=mw/bw,sy=mh/bh;
    const toMX=wx=>mx-mw/2+(wx-bx)*sx;
    const toMY=wy=>my-mh/2+(wy-by)*sy;

    // track spine
    const sp=this.track.spine;
    g.lineStyle(3,0x999,0.9);g.beginPath();
    g.moveTo(toMX(sp[0].x),toMY(sp[0].y));
    for(const pt of sp)g.lineTo(toMX(pt.x),toMY(pt.y));
    g.strokePath();

    // karts
    for(const k of this.karts){
      const r=k===this.player?4.5:3;
      g.fillStyle(k.def.col,1);
      g.fillCircle(toMX(k.x),toMY(k.y),r);
    }
    // player dot white outline
    g.lineStyle(1.5,0xffffff,1);
    g.strokeCircle(toMX(this.player.x),toMY(this.player.y),4.5);
  }
}

// ═══════════════════════════════════════════════════════
//  SCENES
// ═══════════════════════════════════════════════════════
class BootScene extends Phaser.Scene{
  constructor(){super('Boot');}
  create(){this.scene.start('Menu');}
}

class MenuScene extends Phaser.Scene{
  constructor(){super('Menu');}
  create(){
    this.sel=0;
    this.cameras.main.setBackgroundColor('#0c0820');
    // title
    this.add.text(W/2,55,'KART RACER PRO',{fontSize:'60px',fill:'#f1c40f',fontStyle:'bold',stroke:'#000',strokeThickness:8}).setOrigin(0.5);
    this.add.text(W/2,128,'Choose your kart — then press ENTER or click Play',{fontSize:'15px',fill:'#777'}).setOrigin(0.5);

    this.cards=[];
    for(let i=0;i<CAR_DEFS.length;i++){
      const col=i%3,row=Math.floor(i/3);
      this._mkCard(160+col*220,230+row*190,i);
    }
    this._refresh();

    this.input.keyboard.on('keydown-LEFT', ()=>{this.sel=(this.sel-1+CAR_DEFS.length)%CAR_DEFS.length;this._refresh();});
    this.input.keyboard.on('keydown-RIGHT',()=>{this.sel=(this.sel+1)%CAR_DEFS.length;this._refresh();});
    this.input.keyboard.on('keydown-UP',   ()=>{this.sel=(this.sel-3+CAR_DEFS.length)%CAR_DEFS.length;this._refresh();});
    this.input.keyboard.on('keydown-DOWN', ()=>{this.sel=(this.sel+3)%CAR_DEFS.length;this._refresh();});
    this.input.keyboard.on('keydown-ENTER',()=>this._go());

    this.add.text(W/2,H-30,'Arrow Keys / WASD  ·  SHIFT = Drift  ·  Z or SPACE = Use Item',{fontSize:'13px',fill:'#555'}).setOrigin(0.5);
  }

  _mkCard(cx,cy,idx){
    const def=CAR_DEFS[idx];
    const bg=this.add.rectangle(cx,cy,200,170,0x111133,0.85).setStrokeStyle(2,0x444466)
      .setInteractive({useHandCursor:true})
      .on('pointerdown',()=>{this.sel=idx;this._refresh();this._go();})
      .on('pointerover',()=>this._hover(idx,true))
      .on('pointerout', ()=>this._hover(idx,false));

    // kart preview
    const kg=this.add.graphics();
    kg.fillStyle(def.col,1);kg.fillRoundedRect(cx-26,cy-22,52,26,6);
    kg.fillStyle(0x111122,0.9);kg.fillRect(cx-8,cy-20,20,14);
    kg.fillStyle(def.col,0.5);kg.fillRect(cx-8,cy-20,20,6);

    this.add.text(cx,cy+18,def.name,{fontSize:'16px',fill:'#fff',fontStyle:'bold'}).setOrigin(0.5);

    const statLabels=['SPD','ACC','HDL'];
    const statVals=[def.spd/530,def.acc/820,def.hdl/3.9];
    for(let s=0;s<3;s++){
      const sy=cy+40+s*20;
      this.add.text(cx-90,sy,statLabels[s],{fontSize:'11px',fill:'#888'}).setOrigin(0,0.5);
      this.add.rectangle(cx+10,sy,100,8,0x222244).setOrigin(0,0.5);
      this.add.rectangle(cx-40,sy,statVals[s]*100,8,def.col).setOrigin(0,0.5);
    }

    this.cards.push({bg,idx,hover:false});
  }

  _hover(idx,on){const c=this.cards[idx];if(c)c.hover=on;this._refresh();}

  _refresh(){
    for(const c of this.cards){
      const sel=c.idx===this.sel;
      c.bg.setFillStyle(sel?0x2a1b6e:c.hover?0x1a1450:0x111133,sel?0.95:0.85);
      c.bg.setStrokeStyle(sel?3:1,sel?0xf1c40f:c.hover?0x8888cc:0x444466);
    }
  }

  _go(){this.scene.start('Race',{carIdx:this.sel});}
}

class RaceScene extends Phaser.Scene{
  constructor(){super('Race');}
  init(d){this.carIdx=d.carIdx||0;}

  create(){
    this.cameras.main.setBackgroundColor('#263d18');
    this.cameras.main.setBounds(0,0,WORLD_W,WORLD_H);

    // grass base
    const grass=this.add.graphics().setDepth(-2);
    grass.fillStyle(0x263d18,1);grass.fillRect(0,0,WORLD_W,WORLD_H);
    // grass variation
    for(let i=0;i<400;i++){
      grass.fillStyle(Math.random()<0.5?0x213515:0x2e4a1c,0.55);
      grass.fillCircle(Math.random()*WORLD_W,Math.random()*WORLD_H,12+Math.random()*40);
    }

    // build track
    this.track=new Track();
    this.track.draw(this);
    this.boostPads=this.track.drawBoostPads(this);
    this.track.drawScenery(this);

    // start pose
    const s0=this.track.spine[0],s1=this.track.spine[1];
    const startAng=Math.atan2(s1.y-s0.y,s1.x-s0.x);
    const perp=startAng+Math.PI/2;

    // 6-kart grid (behind start, alternating L/R)
    const GRID=[
      {fwd:0,  side:-45},
      {fwd:-60,side:45},
      {fwd:-120,side:-45},
      {fwd:-180,side:45},
      {fwd:-240,side:-45},
      {fwd:-300,side:45},
    ];

    this.karts=[];
    const pDef=CAR_DEFS[this.carIdx];
    const G0=GRID[0];
    const px=s0.x+Math.cos(startAng)*G0.fwd+Math.cos(perp)*G0.side;
    const py=s0.y+Math.sin(startAng)*G0.fwd+Math.sin(perp)*G0.side;
    this.player=new PlayerKart(this,px,py,startAng,pDef);
    this.karts.push(this.player);

    const aiDefs=CAR_DEFS.filter((_,i)=>i!==this.carIdx);
    const wps=this.track.waypoints(60);
    for(let i=0;i<NUM_AI;i++){
      const gi=GRID[i+1];
      const def=aiDefs[i%aiDefs.length];
      const ax=s0.x+Math.cos(startAng)*gi.fwd+Math.cos(perp)*gi.side;
      const ay=s0.y+Math.sin(startAng)*gi.fwd+Math.sin(perp)*gi.side;
      this.karts.push(new AIKart(this,ax,ay,startAng,def,i,wps));
    }

    this.items=new ItemSystem(this,this.track);
    this.rm=new RaceManager(this.karts,this.track);
    this.hud=new HUD(this,this.player,this.karts,this.rm,this.track);

    // camera: closer zoom for faster feel
    this.cameras.main.startFollow(this.player.ctr,true,0.10,0.10);
    this.cameras.main.setZoom(1.15);

    this._ended=false;
  }

  update(_t,dt){
    const s=dt/1000;
    this.rm.update(dt);

    if(this.rm.started){
      for(const k of this.karts)k.update(dt,this.track,this.karts,this.items);
      this.items.update(s,this.track,this.karts);
      // boost pad detection
      for(const pad of this.boostPads){
        for(const k of this.karts){
          if(k.boostT<=0&&dist(k.x,k.y,pad.x,pad.y)<30){
            k.boostT=900;k.boostPow=130;sfxBoost();
          }
        }
      }
    }

    this.hud.update();

    if(this.rm.finished&&!this._ended){
      this._ended=true;
      this.time.delayedCall(3800,()=>{
        this.items.destroy();
        this.scene.start('Results',{
          results:this.karts.map(k=>({
            name:k.def.name,col:k.def.col,pos:k.position,
            time:k.finTime||this.rm.raceTimer,isPlayer:k===this.player
          }))
        });
      });
    }
  }
}

class ResultsScene extends Phaser.Scene{
  constructor(){super('Results');}
  init(d){this.results=d.results||[];}

  create(){
    this.cameras.main.setBackgroundColor('#0c0820');
    this.add.text(W/2,52,'RACE RESULTS',{fontSize:'54px',fill:'#f1c40f',fontStyle:'bold',stroke:'#000',strokeThickness:7}).setOrigin(0.5);

    const sorted=[...this.results].sort((a,b)=>a.pos-b.pos);
    const medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
    const posN=['1ST','2ND','3RD','4TH','5TH','6TH'];

    for(let i=0;i<sorted.length;i++){
      const r=sorted[i],y=152+i*70;
      if(r.isPlayer){
        this.add.rectangle(W/2,y,W-70,60,0x2a1b6e,0.9).setStrokeStyle(2,0xf1c40f);
      }
      this.add.text(95,y,medals[i]||'  ',{fontSize:'36px'}).setOrigin(0.5);
      this.add.text(190,y,posN[i],{fontSize:'28px',fill:r.isPlayer?'#f1c40f':'#fff',fontStyle:'bold'}).setOrigin(0.5);

      // color swatch
      const sw=this.add.graphics();
      sw.fillStyle(r.col||0xffffff,1);sw.fillRoundedRect(-18,-12,36,24,4);
      sw.x=310;sw.y=y;

      this.add.text(400,y,r.name,{fontSize:'24px',fill:r.isPlayer?'#f1c40f':'#ccc'}).setOrigin(0.5);
      const t=r.time||0;
      const m=Math.floor(t/60000),s=Math.floor((t%60000)/1000),ms=t%1000;
      this.add.text(590,y,`${m}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`,{fontSize:'20px',fill:'#aaa'}).setOrigin(0.5);
      this.add.text(780,y,`${POINTS[i]||1} pts`,{fontSize:'22px',fill:'#f39c12',fontStyle:'bold'}).setOrigin(0.5);
    }

    const btn=(x,lbl,bg,cb)=>{
      const t=this.add.text(x,H-50,lbl,{fontSize:'22px',fill:'#fff',fontStyle:'bold',stroke:'#000',strokeThickness:3,backgroundColor:bg,padding:{x:18,y:10}}).setOrigin(0.5).setInteractive({useHandCursor:true});
      t.on('pointerdown',cb);
      t.on('pointerover',()=>t.setStyle({fill:'#f1c40f'}));
      t.on('pointerout', ()=>t.setStyle({fill:'#fff'}));
    };
    btn(W/2-175,'▶  RACE AGAIN','#1a6e30',()=>this.scene.start('Race',{carIdx:0}));
    btn(W/2+175,'⟵  MAIN MENU','#6e1a1a',()=>this.scene.start('Menu'));

    this.input.keyboard.on('keydown-ENTER',()=>this.scene.start('Race',{carIdx:0}));
    this.input.keyboard.on('keydown-ESC',  ()=>this.scene.start('Menu'));
  }
}
