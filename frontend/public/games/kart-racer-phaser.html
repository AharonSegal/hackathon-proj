let _ac=null;
const getAC=()=>{if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;};
function tone(freq,dur,type='sine',vol=0.28){
  try{
    const a=getAC(),o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g);g.connect(a.destination);
    o.start();o.stop(a.currentTime+dur+0.05);
  }catch(e){}
}
const sfxBeep=go=>go?tone(880,0.2,'sine',0.4):tone(440,0.12,'sine',0.35);
function sfxBoost(){tone(180,0.05,'sawtooth',0.15);setTimeout(()=>tone(380,0.12,'sawtooth',0.15),65);}
const sfxHit=()=>tone(100,0.3,'sawtooth',0.35);
function sfxItem(){tone(660,0.07,'sine',0.2);setTimeout(()=>tone(990,0.11,'sine',0.2),95);}
const sfxFall=()=>tone(200,0.6,'sine',0.3);

// ══════════════════════════════════════════════════════════════
//  MATH
// ══════════════════════════════════════════════════════════════
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function normAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  if(l2<0.01)return{x:ax,y:ay,t:0,d:dist(px,py,ax,ay)};
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);
  const cx=ax+t*dx,cy=ay+t*dy;
  return{x:cx,y:cy,t,d:dist(px,py,cx,cy)};
}
// Catmull-Rom, seg=10 keeps spine count manageable (20pts × 10 = 200 segments)
function catmull(pts,seg=10){
  const n=pts.length,out=[];
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    for(let j=0;j<seg;j++){
      const t=j/seg,t2=t*t,t3=t2*t;
      out.push({
        x:.5*((-p0.x+3*p1.x-3*p2.x+p3.x)*t3+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+p2.x)*t+2*p1.x),
        y:.5*((-p0.y+3*p1.y-3*p2.y+p3.y)*t3+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+p2.y)*t+2*p1.y),
      });
    }
  }
  out.push({...out[0]});
  return out;
}
function hslToRgb(h,s,l){
  const a=s*Math.min(l,1-l),f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};
  return (Math.round(f(0)*255)<<16)|(Math.round(f(8)*255)<<8)|Math.round(f(4)*255);
}

// ══════════════════════════════════════════════════════════════
//  TRACK CLASS
// ══════════════════════════════════════════════════════════════
class Track{
  constructor(mapDef){
    this.map=mapDef;
    this.hw=mapDef.trackW/2;
    this.spine=catmull(mapDef.raw,10);
    this.arc=[0];
    for(let i=1;i<this.spine.length;i++){
      const dx=this.spine[i].x-this.spine[i-1].x,dy=this.spine[i].y-this.spine[i-1].y;
      this.arc.push(this.arc[i-1]+Math.sqrt(dx*dx+dy*dy));
    }
    this.totalLen=this.arc[this.arc.length-1];
  }

  query(px,py,hint=0){
    let best=1e9,bi=0,bp=null;
    const sp=this.spine,n=sp.length-1;
    const lo=Math.max(0,hint-25),hi=Math.min(n-1,hint+25);
    for(let i=lo;i<hi;i++){
      const r=closestOnSeg(px,py,sp[i].x,sp[i].y,sp[i+1].x,sp[i+1].y);
      if(r.d<best){best=r.d;bi=i;bp=r;}
    }
    if(best>this.hw+80){
      for(let i=0;i<n;i++){
        const r=closestOnSeg(px,py,sp[i].x,sp[i].y,sp[i+1].x,sp[i+1].y);
        if(r.d<best){best=r.d;bi=i;bp=r;}
      }
    }
    const prog=(this.arc[bi]+(bp.t*(this.arc[bi+1]-this.arc[bi])))/this.totalLen;
    return{onRoad:best<=this.hw+12,d:best,prog,si:bi};
  }

  atProg(t){
    const target=t*this.totalLen;
    let i=0;
    while(i<this.arc.length-2&&this.arc[i+1]<target)i++;
    const f=this.arc[i+1]===this.arc[i]?0:(target-this.arc[i])/(this.arc[i+1]-this.arc[i]);
    const a=this.spine[i],b=this.spine[i+1]||this.spine[0];
    return{x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f),ang:Math.atan2(b.y-a.y,b.x-a.x)};
  }

  waypoints(n=60){const w=[];for(let i=0;i<n;i++)w.push(this.atProg(i/n));return w;}

  // KEY FIX: batch curb drawing — 2 strokePath calls total, not 400
  draw(scene){
    const m=this.map,sp=this.spine,g=scene.add.graphics().setDepth(0);
    const tw=m.trackW;

    // 1. dark border (1 stroke)
    g.lineStyle(tw+32,0x111111,1);
    g.beginPath();g.moveTo(sp[0].x,sp[0].y);
    for(let i=1;i<sp.length;i++)g.lineTo(sp[i].x,sp[i].y);
    g.strokePath();

    if(m.theme==='rainbow'){
      // Rainbow: 12 hue bands, batch each band's segments
      const steps=12;
      for(let h=0;h<steps;h++){
        const col=hslToRgb(h/steps,0.95,0.58);
        g.lineStyle(tw,col,1);
        g.beginPath();
        for(let i=0;i<sp.length-1;i++){
          const band=Math.floor((i/(sp.length-1))*steps);
          if(band===h){g.moveTo(sp[i].x,sp[i].y);g.lineTo(sp[i+1].x,sp[i+1].y);}
        }
        g.strokePath();
      }
      // Glow edge (white dotted centre)
      g.lineStyle(3,0xffffff,0.5);
      g.beginPath();g.moveTo(sp[0].x,sp[0].y);
      for(let i=1;i<sp.length;i+=2)g.lineTo(sp[i].x,sp[i].y);
      g.strokePath();
    } else {
      // 2. Curb color A — collect all "even-stripe" segments into ONE path
      // Stripe bucket = floor(arcLen / 48) % 2
      // Pre-compute bucket for each segment
      let cum=0;
      const buckets=[];
      for(let i=0;i<sp.length-1;i++){
        const dx=sp[i+1].x-sp[i].x,dy=sp[i+1].y-sp[i].y;
        buckets.push(Math.floor(cum/48)%2);
        cum+=Math.sqrt(dx*dx+dy*dy);
      }
      g.lineStyle(tw+16,m.curbA,1);
      g.beginPath();
      for(let i=0;i<sp.length-1;i++){if(buckets[i]===0){g.moveTo(sp[i].x,sp[i].y);g.lineTo(sp[i+1].x,sp[i+1].y);}}
      g.strokePath();

      // 3. Curb color B — same but bucket===1
      g.lineStyle(tw+16,m.curbB,1);
      g.beginPath();
      for(let i=0;i<sp.length-1;i++){if(buckets[i]===1){g.moveTo(sp[i].x,sp[i].y);g.lineTo(sp[i+1].x,sp[i+1].y);}}
      g.strokePath();

      // 4. Road surface (1 stroke)
      g.lineStyle(tw,m.roadCol,1);
      g.beginPath();g.moveTo(sp[0].x,sp[0].y);
      for(let i=1;i<sp.length;i++)g.lineTo(sp[i].x,sp[i].y);
      g.strokePath();

      // 5. Centre dashes — batch even segments (every other)
      g.lineStyle(4,0xffffff,0.3);
      g.beginPath();
      for(let i=0;i<sp.length-1;i+=2){g.moveTo(sp[i].x,sp[i].y);g.lineTo(sp[i+1].x,sp[i+1].y);}
      g.strokePath();

      // 6. Ice zones — draw a translucent blue overlay over ice sections
      if(m.hazards.iceZones){
        for(const z of m.hazards.iceZones){
          const lo=Math.floor(z.s*(sp.length-1)),hi=Math.floor(z.e*(sp.length-1));
          g.lineStyle(tw-10,0x88ccff,0.35);
          g.beginPath();g.moveTo(sp[lo].x,sp[lo].y);
          for(let i=lo+1;i<=hi&&i<sp.length;i++)g.lineTo(sp[i].x,sp[i].y);
          g.strokePath();
        }
      }
    }

    // 7. Start/finish checkered (always)
    const s0=sp[0],s1=sp[1];
    const sfAng=Math.atan2(s1.y-s0.y,s1.x-s0.x)+Math.PI/2;
    const sq=20,cols=Math.ceil(tw/sq)+1;
    for(let row=0;row<2;row++){
      for(let col=0;col<cols;col++){
        const px=s0.x+Math.cos(sfAng)*(col*sq-tw/2)+Math.cos(sfAng-Math.PI/2)*row*sq;
        const py=s0.y+Math.sin(sfAng)*(col*sq-tw/2)+Math.sin(sfAng-Math.PI/2)*row*sq;
        g.fillStyle((row+col)%2?0x000000:0xffffff,1);
        g.fillRect(px,py,sq,sq);
      }
    }
    return g;
  }

  drawBoostPads(scene){
    const pads=[];
    for(const t of this.map.boostProgs){
      const pt=this.atProg(t),perp=pt.ang+Math.PI/2;
      for(let o=-1;o<=1;o++){
        const bx=pt.x+Math.cos(perp)*o*42,by=pt.y+Math.sin(perp)*o*42;
        const g=scene.add.graphics().setDepth(2);
        g.fillStyle(0x00e5ff,0.88);g.fillRect(-20,-8,40,16);
        g.lineStyle(2,0xffffff,0.9);g.strokeRect(-20,-8,40,16);
        g.fillStyle(0xffffff,0.95);g.fillTriangle(-3,-5,14,0,-3,5);
        g.x=bx;g.y=by;g.angle=Phaser.Math.RadToDeg(pt.ang);
        pads.push({x:bx,y:by});
      }
    }
    return pads;
  }

  drawScenery(scene){
    const m=this.map;
    const bg=scene.add.graphics().setDepth(-2);
    // background fill
    bg.fillStyle(m.grassCol,1);bg.fillRect(0,0,m.ww,m.wh);
    // texture patches
    for(let i=0;i<500;i++){
      const cx=Math.random()*m.ww,cy=Math.random()*m.wh;
      if(m.theme==='rainbow'){
        // stars
        bg.fillStyle(0xffffff,Math.random()*0.8+0.2);
        bg.fillCircle(cx,cy,Math.random()*2+0.5);
      }else if(m.theme==='volcano'){
        bg.fillStyle(Math.random()<0.5?0x1a0500:0x2a0800,0.6);
        bg.fillCircle(cx,cy,10+Math.random()*35);
      }else if(m.theme==='snow'){
        bg.fillStyle(Math.random()<0.5?0xbbddee:0xd8eef8,0.45);
        bg.fillCircle(cx,cy,8+Math.random()*25);
      }else{
        bg.fillStyle(Math.random()<0.5?0x1e3010:0x30501c,0.55);
        bg.fillCircle(cx,cy,10+Math.random()*35);
      }
    }

    // single batched scenery Graphics
    const sg=scene.add.graphics().setDepth(1);
    const count=m.theme==='rainbow'?0:100;
    for(let i=0;i<count;i++){
      const tx=100+Math.random()*(m.ww-200),ty=100+Math.random()*(m.wh-200);
      if(this.query(tx,ty).d<this.hw+95)continue;
      if(m.theme==='snow'){
        // pine tree
        const r=12+Math.random()*16;
        sg.fillStyle(0x5c3d1e,1);sg.fillRect(tx-3,ty+r*0.4,6,16);
        sg.fillStyle(0x225a44,1);sg.fillTriangle(tx,ty-r,tx-r*0.9,ty+r*0.3,tx+r*0.9,ty+r*0.3);
        sg.fillStyle(0x2a7058,1);sg.fillTriangle(tx,ty-r*0.4,tx-r*0.7,ty+r*0.7,tx+r*0.7,ty+r*0.7);
        sg.fillStyle(0xeef8ff,0.6);sg.fillCircle(tx,ty-r*0.8,r*0.25);
      }else if(m.theme==='volcano'){
        // rock formation
        const r=10+Math.random()*18;
        sg.fillStyle(0x3a2010,1);sg.fillCircle(tx,ty,r);
        sg.fillStyle(0x551a00,1);sg.fillCircle(tx-r*0.3,ty-r*0.3,r*0.6);
        // occasional lava glow near rocks
        if(Math.random()<0.3){sg.fillStyle(0xff4400,0.15);sg.fillCircle(tx,ty,r*2);}
      }else{
        // green tree
        const r=12+Math.random()*16;
        sg.fillStyle(0x5c3d1e,1);sg.fillRect(tx-3,ty+r*0.3,6,14);
        sg.fillStyle(0x1a5410,1);sg.fillCircle(tx,ty,r*1.1);
        sg.fillStyle(0x246b18,1);sg.fillCircle(tx,ty-r*0.2,r);
        sg.fillStyle(0x30821e,1);sg.fillCircle(tx,ty-r*0.4,r*0.65);
      }
    }

    // Volcano: draw the central lava lake
    if(m.theme==='volcano'&&m.hazards.lavaPools){
      for(const lp of m.hazards.lavaPools){
        // glow
        bg.fillStyle(0xff6600,0.08);bg.fillCircle(lp.x,lp.y,lp.r*2.5);
        bg.fillStyle(0xff8800,0.12);bg.fillCircle(lp.x,lp.y,lp.r*1.6);
        // lava surface
        bg.fillStyle(0xdd4400,1);bg.fillCircle(lp.x,lp.y,lp.r);
        bg.fillStyle(0xff6600,1);bg.fillCircle(lp.x-lp.r*0.2,lp.y-lp.r*0.2,lp.r*0.6);
        bg.fillStyle(0xff9900,0.7);bg.fillCircle(lp.x+lp.r*0.1,lp.y+lp.r*0.1,lp.r*0.3);
        // label
        const lt=scene.add.text(lp.x,lp.y,'🌋',{fontSize:'28px'}).setOrigin(0.5).setDepth(1).setAlpha(0.8);
      }
    }

    // Rainbow: coloured nebula rings
    if(m.theme==='rainbow'){
      for(let h=0;h<6;h++){
        const col=hslToRgb(h/6,0.8,0.4);
        bg.fillStyle(col,0.04);
        bg.fillCircle(m.ww*0.5+Math.cos(h)*800,m.wh*0.5+Math.sin(h)*600,700);
      }
    }

    // Start grandstands
    const sf=this.atProg(0.01);
    const perp=sf.ang+Math.PI/2;
    for(let side=-1;side<=1;side+=2){
      const gx=sf.x+Math.cos(perp)*side*(this.hw+65);
      const gy=sf.y+Math.sin(perp)*side*(this.hw+65);
      sg.fillStyle(side<0?0xcc4422:0x2244cc,1);
      sg.fillRect(gx-55,gy-28,110,46);
      sg.fillStyle(0xffffff,0.25);
      for(let r=0;r<3;r++)sg.fillRect(gx-50+r*38,gy-22,30,9);
    }
  }
}

// ══════════════════════════════════════════════════════════════
//  HAZARD SYSTEM — ice / lava / falling rocks / rainbow edge
// ══════════════════════════════════════════════════════════════
class HazardSystem{
  constructor(scene,track,mapDef){
    this.scene=scene;this.track=track;this.map=mapDef;
    this.rocks=[];this.rockTimer=0;
    this.fallingKarts=new Map(); // kart → {timer, respawnProg}
  }

  // Called per kart per frame to check/apply hazard
  applyToKart(kart,s){
    const h=this.map.hazards;
    // ── ICE: in ice zones, reduce handling & coast friction
    if(h.iceZones){
      kart.inIce=false;
      for(const z of h.iceZones){
        const p=kart.lastProg||0;
        if(p>=z.s&&p<=z.e){kart.inIce=true;break;}
      }
    }
    // ── LAVA: touch a pool = respawn
    if(h.lavaPools){
      for(const lp of h.lavaPools){
        if(dist(kart.x,kart.y,lp.x,lp.y)<lp.r+20){
          this._respawnKart(kart);break;
        }
      }
    }
    // ── RAINBOW EDGE: off-road = fall
    if(h.rainbowEdge&&!kart.onRoad&&!this.fallingKarts.has(kart)){
      this.fallingKarts.set(kart,{timer:1600,prog:kart.lastProg||0});
      sfxFall();
      kart.spd=0;kart.stunT=1700;
    }
  }

  updateFallingKarts(s){
    for(const[kart,state] of this.fallingKarts){
      state.timer-=s*1000;
      // visual: shrink while falling
      kart.ctr.setScale(lerp(0.1,1,(state.timer/1600)));
      if(state.timer<=0){
        const pt=this.track.atProg(Math.max(0,state.prog-0.02));
        kart.x=pt.x;kart.y=pt.y;kart.ang=pt.ang;
        kart.spd=50;kart.stunT=800;
        kart.ctr.setScale(1);
        this.fallingKarts.delete(kart);
      }
    }
  }

  _respawnKart(kart){
    if(kart.stunT>500)return; // already respawning
    kart.spd=0;kart.stunT=1800;kart.flashT=2000;
    const prog=Math.max(0,(kart.lastProg||0)-0.025);
    const pt=this.track.atProg(prog);
    kart.x=pt.x;kart.y=pt.y;kart.ang=pt.ang;
    sfxFall();
  }

  updateRocks(s){
    if(!this.map.hazards.fallingRocks)return;
    this.rockTimer-=s*1000;
    if(this.rockTimer<=0){
      this.rockTimer=2000+Math.random()*3000;
      this._spawnRock();
    }
    for(const r of this.rocks){
      r.life-=s*1000;
      r.g.setAlpha(Math.min(1,r.life/400));
      if(r.life<=0){r.g.destroy();}
    }
    this.rocks=this.rocks.filter(r=>r.life>0);
  }

  _spawnRock(){
    const t=Math.random();
    const pt=this.track.atProg(t);
    const perp=pt.ang+Math.PI/2;
    const side=(Math.random()<0.5?-1:1);
    const dist2=this.track.hw*(0.3+Math.random()*0.5);
    const rx=pt.x+Math.cos(perp)*side*dist2;
    const ry=pt.y+Math.sin(perp)*side*dist2;
    const sz=18+Math.random()*22;
    const g=this.scene.add.graphics().setDepth(9).setAlpha(0);
    g.fillStyle(0x888888,1);g.fillCircle(0,0,sz);
    g.fillStyle(0xaaaaaa,0.5);g.fillCircle(-sz*0.2,-sz*0.3,sz*0.35);
    g.x=rx;g.y=ry;
    this.scene.tweens.add({targets:g,alpha:1,duration:400,yoyo:false});
    this.rocks.push({x:rx,y:ry,r:sz,g,life:2200});
  }

  checkRockHits(karts){
    for(const rock of this.rocks){
      if(rock.life<400)continue;
      for(const k of karts){
        if(dist(k.x,k.y,rock.x,rock.y)<rock.r+18)k.hit('rock');
      }
    }
  }

  destroy(){for(const r of this.rocks)r.g.destroy();}
}

// ══════════════════════════════════════════════════════════════
//  KART BASE  — all physics in px/s
// ══════════════════════════════════════════════════════════════
class Kart{
  constructor(scene,x,y,ang,def,idx){
    this.scene=scene;this.def=def;this.idx=idx;
    this.x=x;this.y=y;this.ang=ang;this.spd=0;
    // race
    this.totalProg=0;this.lastProg=null;this.lap=0;
    this.position=idx+1;this.finished=false;this.finTime=0;
    this.segHint=0;
    // items
    this.heldItem=null;this.itemCD=0;
    this.fx={};
    // boost
    this.boostT=0;this.boostPow=0;
    // drift state machine: 'none'|'drifting'
    this.driftState='none';
    this.driftDir=0;this.driftQ=0;this.driftLv=0;
    // stun
    this.stunT=0;this.spinT=0;this.spinDir=1;
    this.flashT=0;this.kartScale=1;
    this.onRoad=true;this.inIce=false;
    this._buildGfx();
  }

  _buildGfx(){
    const sc=this.scene,c=this.def.col;
    // container rotates with kart angle
    this.ctr=sc.add.container(this.x,this.y).setDepth(10+this.idx);

    // ── SHADOW (stays flat under kart)
    const sh=sc.add.ellipse(6,12,58,20,0x000000,0.18);
    this.ctr.add(sh);

    // ── BODY — proper kart shape:
    // Forward direction = +x, body center at (0,0)
    // Width (x) = 46px, Height (y) = 24px
    const body=sc.add.graphics();
    // base chassis
    body.fillStyle(c,1);
    body.fillRoundedRect(-23,-12,46,24,5);
    // cockpit opening (slightly darker)
    body.fillStyle(0x000000,0.35);
    body.fillRoundedRect(-4,-9,16,18,3);
    // windshield (blue tint)
    body.fillStyle(0x88ccff,0.5);
    body.fillRoundedRect(-1,-8,12,7,2);
    // side stripe (lighter version of color)
    body.fillStyle(0xffffff,0.18);
    body.fillRect(-20,-3,42,4);
    // front bumper
    body.fillStyle(0x222222,1);
    body.fillRect(20,-8,6,16);
    body.fillStyle(0xffffff,0.3);
    body.fillRect(21,-6,3,12);
    // rear diffuser
    body.fillStyle(0x333333,1);
    body.fillRect(-26,-9,5,18);
    // exhaust nubs
    body.fillStyle(0x888888,1);
    body.fillRect(-27,-11,4,4);
    body.fillRect(-27,7,4,4);
    this.ctr.add(body);

    // ── WHEELS — 4 corners, y=±16 (OUTSIDE the body's ±12 boundary)
    // Wheel in local kart space: thin rectangle (xw=10, yw=7)
    // Front axle at x=+16, Rear axle at x=-16
    // Left (negative y) and Right (positive y)
    this.wheels=[];
    for(const[wx,wy] of[[16,-16],[16,16],[-16,-16],[-16,16]]){
      const wg=sc.add.graphics();
      // tire (black, rounded)
      wg.fillStyle(0x111111,1);
      wg.fillRoundedRect(-5,-4,10,8,2);
      // hub cap (bright center)
      wg.fillStyle(0xcccccc,1);
      wg.fillCircle(0,0,2.5);
      // colored inner ring
      wg.fillStyle(c,0.5);
      wg.fillCircle(0,0,1.5);
      wg.x=wx;wg.y=wy;
      this.ctr.add(wg);
      this.wheels.push(wg);
    }

    // ── EFFECTS LAYERS (drawn each frame)
    this.sparkGfx=sc.add.graphics();this.ctr.add(this.sparkGfx);
    this.flameGfx=sc.add.graphics();this.ctr.add(this.flameGfx);
    this.glowGfx =sc.add.graphics();this.ctr.add(this.glowGfx);
    this.shieldGfx=sc.add.graphics();this.ctr.add(this.shieldGfx);
    this.iceGfx  =sc.add.graphics();this.ctr.add(this.iceGfx);

    // ── NAME TAG
    const nt=sc.add.text(0,-30,this.def.name,{fontSize:'10px',fill:'#fff',stroke:'#000',strokeThickness:2,fontStyle:'bold'}).setOrigin(0.5,1);
    this.ctr.add(nt);
  }

  get maxSpd(){
    let s=this.def.spd;
    if(this.boostT>0)s+=this.boostPow;
    if(this.fx.star)s+=180;
    if(this.fx.lightning)s*=0.45;
    return s;
  }

  update(dt,track,karts,items,hazards){
    if(this.finished)return;
    const s=dt/1000;

    // timers
    if(this.stunT>0)this.stunT-=dt;
    if(this.spinT>0){this.spinT-=dt;this.ang+=this.spinDir*10*s;}
    if(this.boostT>0)this.boostT-=dt;else this.boostPow=0;
    if(this.flashT>0)this.flashT-=dt;
    if(this.itemCD>0)this.itemCD-=dt;
    for(const k of Object.keys(this.fx)){this.fx[k]-=dt;if(this.fx[k]<=0)delete this.fx[k];}

    if(this.stunT<=0&&this.spinT<=0) this.drive(s,track,karts,items);

    // hazard effects (ice, lava, rainbow)
    if(hazards)hazards.applyToKart(this,s);

    // off-road query
    const q=track.query(this.x,this.y,this.segHint);
    this.onRoad=q.onRoad;this.segHint=q.si;

    // off-road cap
    if(!this.onRoad){
      const offMax=this.def.spd*0.50;
      if(this.spd>offMax)this.spd-=(this.spd-offMax)*Math.min(6*s,1);
    }

    this.spd=clamp(this.spd,-this.maxSpd*0.4,this.maxSpd);

    // move
    this.x+=Math.cos(this.ang)*this.spd*s;
    this.y+=Math.sin(this.ang)*this.spd*s;
    const m=track.map;
    this.x=clamp(this.x,50,m.ww-50);
    this.y=clamp(this.y,50,m.wh-50);

    // soft kart push
    for(const o of karts){
      if(o===this)continue;
      const dx=this.x-o.x,dy=this.y-o.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<42&&d>0.5){
        const push=(42-d)/42*3.5;
        this.x+=(dx/d)*push*0.5;this.y+=(dy/d)*push*0.5;
        this.spd*=1-push*0.01;
      }
    }

    // lap tracking (monotonic)
    const np=q.prog;
    if(this.lastProg===null)this.lastProg=np;
    let delta=np-this.lastProg;
    if(delta<-0.5)delta+=1;
    if(delta>0.5)delta-=1;
    this.totalProg+=delta;this.lastProg=np;
    if(Math.floor(this.totalProg)>this.lap){
      this.lap=Math.floor(this.totalProg);
      if(this.lap>=TOTAL_LAPS&&!this.finished){
        this.finished=true;this.finTime=this.scene.rm?.raceTimer||0;
      }
    }

    // visual
    this.ctr.x=this.x;this.ctr.y=this.y;this.ctr.rotation=this.ang;
    const tgt=this.fx.lightning?0.5:1;
    this.kartScale=lerp(this.kartScale,tgt,0.1);
    this.ctr.setScale(this.kartScale);
    this.ctr.setAlpha(this.flashT>0&&Math.floor(this.flashT/90)%2?0.2:1);
    this._vfx();
  }

  drive(){}

  applyDriftBoost(){
    if(this.driftQ>=72){this.boostT=1900;this.boostPow=230;sfxBoost();}
    else if(this.driftQ>=40){this.boostT=1050;this.boostPow=160;sfxBoost();}
    else if(this.driftQ>=16){this.boostT=480;this.boostPow=95;}
    this.driftQ=0;this.driftLv=0;this.driftState='none';
  }

  hit(src){
    if(this.fx.star||this.fx.shield){delete this.fx.shield;return;}
    sfxHit();
    this.stunT=1200;this.spinT=700;
    this.spinDir=Math.random()<0.5?1:-1;
    this.flashT=1400;this.spd*=-0.18;
    this.heldItem=null;
    if(this.driftState==='drifting'){this.driftQ=0;this.driftState='none';}
    // screen shake only for player kart
    if(this.scene.player===this)this.scene.cameras.main.shake(280,0.008);
  }

  _vfx(){
    // sparks
    this.sparkGfx.clear();
    if(this.driftState==='drifting'&&this.driftQ>8){
      const cols=[0x44aaff,0xff8800,0xaa00ff];
      this.sparkGfx.fillStyle(cols[this.driftLv],1);
      for(let i=0;i<5;i++){
        const ox=-18+this.driftDir*7+Math.random()*8,oy=10+Math.random()*10;
        this.sparkGfx.fillRect(ox,oy,2+Math.random()*5,2+Math.random()*4);
      }
    }
    // boost flame
    this.flameGfx.clear();
    if(this.boostT>0){
      const sz=1+Math.random()*0.5;
      this.flameGfx.fillStyle(0xff6600,0.9);
      this.flameGfx.fillTriangle(-24,-8*sz,-24,8*sz,-38-Math.random()*8,0);
      this.flameGfx.fillStyle(0xffee00,0.75);
      this.flameGfx.fillTriangle(-24,-4*sz,-24,4*sz,-32-Math.random()*5,0);
    }
    // star glow
    this.glowGfx.clear();
    if(this.fx.star){
      this.glowGfx.setAlpha(0.4+Math.sin(Date.now()/70)*0.3);
      this.glowGfx.fillStyle(0xffff33,0.45);
      this.glowGfx.fillCircle(0,0,36);
    }else this.glowGfx.setAlpha(1);
    // shield ring
    this.shieldGfx.clear();
    if(this.fx.shield){
      this.shieldGfx.lineStyle(3,0x44aaff,0.6+Math.sin(Date.now()/55)*0.25);
      this.shieldGfx.strokeCircle(0,0,34);
    }
    // ice sparkle
    this.iceGfx.clear();
    if(this.inIce){
      this.iceGfx.fillStyle(0xaaddff,0.3+Math.random()*0.3);
      this.iceGfx.fillCircle(Math.random()*50-25,Math.random()*30-15,2+Math.random()*3);
    }
  }

  destroy(){this.ctr.destroy();}
}

// ══════════════════════════════════════════════════════════════
//  PLAYER KART
// ══════════════════════════════════════════════════════════════
class PlayerKart extends Kart{
  constructor(scene,x,y,ang,def){
    super(scene,x,y,ang,def,0);
    this.keys=scene.input.keyboard.addKeys({
      up:Phaser.Input.Keyboard.KeyCodes.UP,
      dn:Phaser.Input.Keyboard.KeyCodes.DOWN,
      lt:Phaser.Input.Keyboard.KeyCodes.LEFT,
      rt:Phaser.Input.Keyboard.KeyCodes.RIGHT,
      w:Phaser.Input.Keyboard.KeyCodes.W,s:Phaser.Input.Keyboard.KeyCodes.S,
      a:Phaser.Input.Keyboard.KeyCodes.A,d:Phaser.Input.Keyboard.KeyCodes.D,
      drift:Phaser.Input.Keyboard.KeyCodes.SHIFT,
      item:Phaser.Input.Keyboard.KeyCodes.Z,
      item2:Phaser.Input.Keyboard.KeyCodes.SPACE,
    });
  }

  drive(s,track,karts,items){
    const k=this.keys;
    const up=k.up.isDown||k.w.isDown;
    const dn=k.dn.isDown||k.s.isDown;
    const lt=k.lt.isDown||k.a.isDown;
    const rt=k.rt.isDown||k.d.isDown;
    const dr=k.drift.isDown;

    // acceleration (near-zero friction while pressing gas → kart reaches maxSpd)
    if(up){
      const gap=this.maxSpd-this.spd;
      if(gap>0)this.spd+=Math.min(this.def.acc*s,gap);
    } else if(dn){
      if(this.spd>8)this.spd-=this.def.brake*s;
      else this.spd=Math.max(this.spd-this.def.acc*0.5*s,-this.maxSpd*0.35);
    } else {
      // coast — ice reduces deceleration (kart slides further)
      const coastRate=this.inIce?0.04:0.12;
      this.spd*=Math.pow(coastRate,s);
      if(Math.abs(this.spd)<6)this.spd=0;
    }

    // turn rate — ice reduces control
    const sr=clamp(Math.abs(this.spd)/this.def.spd,0.15,1.2);
    const iceHdlMult=this.inIce?0.5:1.0;
    const tr=this.def.hdl*sr*iceHdlMult;

    if(this.driftState==='none'){
      const sign=this.spd>=0?1:-1;
      if(lt)this.ang-=tr*s*sign;
      if(rt)this.ang+=tr*s*sign;
    }

    // drift state machine
    if(this.driftState==='none'&&dr&&(lt||rt)&&this.spd>130){
      this.driftState='drifting';this.driftDir=lt?-1:1;
      this.driftQ=0;this.driftLv=0;
    }
    if(this.driftState==='drifting'){
      const dtr=this.def.hdl*1.6;
      if(lt)this.ang-=dtr*s;
      if(rt)this.ang+=dtr*s;
      this.ang+=this.driftDir*this.def.hdl*0.5*s;  // counter-steer slide
      if(up&&(lt||rt)){
        this.driftQ=Math.min(100,this.driftQ+90*s);
        this.driftLv=this.driftQ>=72?2:this.driftQ>=40?1:0;
      }
      if(!dr||this.spd<75)this.applyDriftBoost();
    }

    // item use
    if((Phaser.Input.Keyboard.JustDown(k.item)||Phaser.Input.Keyboard.JustDown(k.item2))
        &&this.heldItem&&this.itemCD<=0){
      items.use(this,this.heldItem,karts);
      this.heldItem=null;this.itemCD=500;
    }
  }
}

// ══════════════════════════════════════════════════════════════
//  AI KART
// ══════════════════════════════════════════════════════════════
class AIKart extends Kart{
  constructor(scene,x,y,ang,def,aiIdx,wps){
    super(scene,x,y,ang,def,aiIdx+1);
    this.wps=wps;this.wpIdx=aiIdx*3;
    this.skill=0.58+aiIdx*0.09;
    this.itemT=1500+Math.random()*3000;
  }

  drive(s,track,karts,items){
    const wp=this.wps[this.wpIdx%this.wps.length];
    const dx=wp.x-this.x,dy=wp.y-this.y,d2wp=Math.sqrt(dx*dx+dy*dy);
    if(d2wp<90)this.wpIdx=(this.wpIdx+1)%this.wps.length;

    const tgtAng=Math.atan2(dy,dx);
    const diff=normAngle(tgtAng-this.ang);
    const sr=clamp(Math.abs(this.spd)/this.def.spd,0.2,1.2);
    const iceMult=this.inIce?0.6:1;
    this.ang+=clamp(diff,-(this.def.hdl*sr*iceMult*s),(this.def.hdl*sr*iceMult*s));

    // rubber-band
    const rb=this.position>3?1.12:(this.position===1?0.91:1.0);
    const tgtSpd=this.def.spd*this.skill*rb*(this.onRoad?1:0.55)*(this.inIce?0.85:1);
    this.spd+=clamp((tgtSpd-this.spd)*4*s,-this.def.brake*s,this.def.acc*s);

    // AI drift on sharp corners
    if(this.driftState==='none'&&Math.abs(diff)>0.7&&this.spd>160){
      this.driftState='drifting';this.driftDir=diff>0?1:-1;this.driftQ=0;
    }
    if(this.driftState==='drifting'){
      this.driftQ+=75*s;
      if(this.driftQ>55||Math.abs(diff)<0.2)this.applyDriftBoost();
    }

    // item use
    this.itemT-=s*1000;
    if(this.itemT<=0&&this.heldItem&&this.itemCD<=0){
      this.itemT=2000+Math.random()*3000;
      items.use(this,this.heldItem,karts);
      this.heldItem=null;this.itemCD=500;
    }
  }
}

// ══════════════════════════════════════════════════════════════
//  PROJECTILE
// ══════════════════════════════════════════════════════════════
class Proj{
  constructor(scene,x,y,ang,type,owner){
    this.scene=scene;this.x=x;this.y=y;this.ang=ang;
    this.type=type;this.owner=owner;this.alive=true;
    this.spd=type==='banana'?0:530;
    this.bounces=type==='green_shell'?3:0;
    this.life=type==='banana'?26000:5500;
    this.gfx=scene.add.graphics().setDepth(8);
    const pal={green_shell:0x2ecc71,red_shell:0xe74c3c,bomb:0x333333};
    if(type==='banana'){
      // crescent arc — thick yellow arc with dark inner shadow
      this.gfx.lineStyle(7,0xf1c40f,1);
      this.gfx.beginPath();this.gfx.arc(0,0,11,0.18,Math.PI-0.18,false);this.gfx.strokePath();
      this.gfx.fillStyle(0xf1c40f,1);
      this.gfx.fillCircle(Math.cos(0.18)*11,Math.sin(0.18)*11,3.8);
      this.gfx.fillCircle(Math.cos(Math.PI-0.18)*11,Math.sin(Math.PI-0.18)*11,3.8);
      this.gfx.lineStyle(3,0xcc8800,0.65);
      this.gfx.beginPath();this.gfx.arc(1,2,9,0.3,Math.PI-0.3,false);this.gfx.strokePath();
    }else if(type==='bomb'){
      this.gfx.fillStyle(0x222,1);this.gfx.fillCircle(0,0,14);
      this.gfx.fillStyle(0xff0000,1);this.gfx.fillCircle(5,-11,4);
    }else{
      this.gfx.fillStyle(pal[type]||0xfff,1);this.gfx.fillCircle(0,0,10);
      this.gfx.lineStyle(2,0xffffff,0.6);this.gfx.strokeCircle(0,0,10);
    }
    this.gfx.x=x;this.gfx.y=y;
  }
  update(s,track,karts){
    if(!this.alive)return;
    this.life-=s*1000;if(this.life<=0){this.destroy();return;}
    if(this.type==='banana'){
      for(const k of karts){
        if(k===this.owner)continue;
        if(dist(this.x,this.y,k.x,k.y)<26){k.hit('banana');this.destroy();return;}
      }
      return;
    }
    if(this.type==='red_shell'){
      let tgt=null,best=1e9;
      for(const k of karts){
        if(k===this.owner||k.finished)continue;
        const d=dist(this.x,this.y,k.x,k.y);
        if(d<best){best=d;tgt=k;}
      }
      if(tgt){const ta=Math.atan2(tgt.y-this.y,tgt.x-this.x);this.ang=normAngle(lerp(this.ang,ta,0.10));}
    }
    this.x+=Math.cos(this.ang)*this.spd*s;
    this.y+=Math.sin(this.ang)*this.spd*s;
    if(this.type==='green_shell'&&!track.query(this.x,this.y).onRoad){
      if(this.bounces-->0)this.ang=normAngle(this.ang+Math.PI*(0.5+Math.random()));
      else{this.destroy();return;}
    }
    for(const k of karts){
      if(k===this.owner&&this.life>5200)continue;
      if(dist(this.x,this.y,k.x,k.y)<32){
        k.hit(this.type);
        if(this.type==='bomb'){
          for(const k2 of karts)if(dist(this.x,this.y,k2.x,k2.y)<105)k2.hit('explosion');
          this._explode();
        }
        this.destroy();return;
      }
    }
    this.gfx.x=this.x;this.gfx.y=this.y;
    this.gfx.angle+=(this.type==='green_shell'?5:this.type==='banana'?3:0);
  }
  _explode(){
    const g=this.scene.add.graphics().setDepth(20);
    g.fillStyle(0xff8800,0.85);g.fillCircle(0,0,70);
    g.fillStyle(0xffee00,0.5);g.fillCircle(0,0,35);
    g.x=this.x;g.y=this.y;
    this.scene.tweens.add({targets:g,alpha:0,scaleX:2.5,scaleY:2.5,duration:420,onComplete:()=>g.destroy()});
  }
  destroy(){this.alive=false;this.gfx.destroy();}
}

// ══════════════════════════════════════════════════════════════
//  ITEM SYSTEM
// ══════════════════════════════════════════════════════════════
class ItemSystem{
  constructor(scene,track){
    this.scene=scene;this.track=track;
    this.boxes=[];this.projs=[];
    this._spawn();
  }
  _spawn(){
    const n=26;
    for(let i=0;i<n;i++){
      const t=i/n,pt=this.track.atProg(t),perp=pt.ang+Math.PI/2;
      const off=((i%3)-1)*48;
      this._mkBox(pt.x+Math.cos(perp)*off,pt.y+Math.sin(perp)*off);
    }
  }
  _mkBox(x,y){
    const g=this.scene.add.graphics().setDepth(5);
    g.fillStyle(0xffd700,1);g.fillRect(-14,-14,28,28);
    g.fillStyle(0xff3300,1);g.fillRect(-10,-2,20,4);g.fillRect(-2,-10,4,20);
    g.lineStyle(2.5,0xffffff,0.9);g.strokeRect(-14,-14,28,28);
    g.fillStyle(0xffffff,0.35);g.fillRect(-12,-12,8,8);
    g.x=x;g.y=y;
    this.scene.tweens.add({targets:g,angle:360,duration:1600,repeat:-1,ease:'Linear'});
    this.boxes.push({x,y,g,on:true,cd:0});
  }
  _pick(pos,total){
    const front=pos<=total/2;
    const pool=Object.entries(ITEM_TABLE).map(([n,w])=>({n,w:w[front?0:1]}));
    const sum=pool.reduce((a,e)=>a+e.w,0);
    let r=Math.random()*sum;
    for(const e of pool){r-=e.w;if(r<=0)return e.n;}
    return 'mushroom';
  }
  checkBoxes(karts){
    for(const b of this.boxes){
      if(!b.on){b.cd-=16;if(b.cd<=0){b.on=true;b.g.setVisible(true);}continue;}
      for(const k of karts){
        if(k.heldItem)continue;
        if(dist(k.x,k.y,b.x,b.y)<32){
          k.heldItem={type:this._pick(k.position,karts.length)};
          sfxItem();b.on=false;b.cd=7500;b.g.setVisible(false);break;
        }
      }
    }
  }
  use(kart,item,karts){
    const t=item.type,fa=kart.ang;
    const ax=kart.x+Math.cos(fa)*44,ay=kart.y+Math.sin(fa)*44;
    const bx=kart.x-Math.cos(fa)*44,by=kart.y-Math.sin(fa)*44;
    switch(t){
      case 'mushroom':       kart.boostT=1600;kart.boostPow=195;sfxBoost();break;
      case 'triple_mushroom':kart.boostT=4800;kart.boostPow=175;sfxBoost();break;
      case 'green_shell':    this.projs.push(new Proj(this.scene,ax,ay,fa,'green_shell',kart));break;
      case 'red_shell':      this.projs.push(new Proj(this.scene,ax,ay,fa,'red_shell',kart));break;
      case 'banana':         this.projs.push(new Proj(this.scene,bx,by,fa,'banana',kart));break;
      case 'bomb':           this.projs.push(new Proj(this.scene,ax,ay,fa,'bomb',kart));break;
      case 'star':           kart.fx.star=9000;kart.boostT=9000;kart.boostPow=180;sfxBoost();break;
      case 'lightning':      for(const k of karts)if(k!==kart){k.fx.lightning=4500;k.hit('lightning');}break;
      case 'shield':         kart.fx.shield=6000;sfxItem();break;
    }
  }
  update(s,track,karts){
    this.checkBoxes(karts);
    for(const p of this.projs)p.update(s,track,karts);
    this.projs=this.projs.filter(p=>p.alive);
  }
  destroy(){for(const b of this.boxes)b.g.destroy();for(const p of this.projs)p.destroy();}
}

// ══════════════════════════════════════════════════════════════
//  RACE MANAGER
// ══════════════════════════════════════════════════════════════
class RaceManager{
  constructor(karts){
    this.karts=karts;
    this.started=false;this.finished=false;
    this.countdown=3;this.cdTimer=0;this.raceTimer=0;
    this.finishOrder=[];
  }
  update(dt){
    if(this.finished)return;
    if(!this.started){
      this.cdTimer+=dt;
      if(this.cdTimer>=1000){
        this.cdTimer-=1000;this.countdown--;
        sfxBeep(this.countdown<0);
        if(this.countdown<0)this.started=true;
      }
      return;
    }
    this.raceTimer+=dt;
    const alive=this.karts.filter(k=>!k.finished);
    alive.sort((a,b)=>(b.totalProg+b.lap)-(a.totalProg+a.lap));
    for(let i=0;i<alive.length;i++)alive[i].position=this.finishOrder.length+i+1;
    for(const k of alive){
      if(k.finished&&!this.finishOrder.includes(k)){
        this.finishOrder.push(k);k.position=this.finishOrder.length;k.finTime=this.raceTimer;
      }
    }
    if(this.karts.every(k=>k.finished))this.finished=true;
    if(this.karts[0].finished&&!this.finished&&this.raceTimer>this.karts[0].finTime+8000)
      this.finished=true;
  }
}

class HUD{
  constructor(scene,player,karts,rm,track){
    this.scene=scene;this.player=player;this.karts=karts;this.rm=rm;this.track=track;
    const sf=0;
    const T=(x,y,t,st,d=100)=>scene.add.text(x,y,t,st).setScrollFactor(sf).setDepth(d);

    this.posTx=T(W-16,16,'1ST',{fontSize:'52px',fill:'#f1c40f',fontStyle:'bold',stroke:'#000',strokeThickness:6}).setOrigin(1,0);
    this.lapTx=T(W/2,16,'LAP 1/3',{fontSize:'25px',fill:'#fff',fontStyle:'bold',stroke:'#000',strokeThickness:3}).setOrigin(0.5,0);
    this.spdTx=T(W-16,H-16,'0 km/h',{fontSize:'18px',fill:'#fff',stroke:'#000',strokeThickness:2}).setOrigin(1,1);
    this.timeTx=T(W/2,48,'0:00.000',{fontSize:'15px',fill:'#aaa',stroke:'#000',strokeThickness:2}).setOrigin(0.5,0);
    this.cdTx=T(W/2,H/2-70,'',{fontSize:'140px',fill:'#fff',fontStyle:'bold',stroke:'#e00',strokeThickness:12}).setOrigin(0.5).setDepth(200);
    this.finTx=T(W/2,H/2+50,'',{fontSize:'34px',fill:'#f1c40f',fontStyle:'bold',stroke:'#000',strokeThickness:5}).setOrigin(0.5).setVisible(false).setDepth(200);

    scene.add.rectangle(72,H-72,72,72,0x000000,0.7).setScrollFactor(sf).setDepth(99);
    scene.add.rectangle(72,H-72,72,72,0,0).setStrokeStyle(2,0xaaaaaa,0.4).setScrollFactor(sf).setDepth(99);
    this.itemTx=T(72,H-72,'',{fontSize:'34px'}).setOrigin(0.5).setScrollFactor(sf).setDepth(101);
    this.fxTx=T(118,H-72,'',{fontSize:'18px'}).setOrigin(0,0.5).setScrollFactor(sf).setDepth(101);

    scene.add.rectangle(W/2,H-18,162,12,0x000000,0.6).setScrollFactor(sf).setDepth(99);
    this.driftBar=scene.add.graphics().setScrollFactor(sf).setDepth(100);

    this.mmW=172;this.mmH=140;
    this.mmX=W-this.mmW/2-12;this.mmY=H-this.mmH/2-12;
    scene.add.rectangle(this.mmX,this.mmY,this.mmW+8,this.mmH+8,0x000000,0.8).setScrollFactor(sf).setDepth(99);
    this.mmGfx=scene.add.graphics().setScrollFactor(sf).setDepth(100);

    this.rankTx=[];
    for(let i=0;i<karts.length;i++){
      this.rankTx.push(T(W-16,108+i*22,'',{fontSize:'13px',fill:'#fff',stroke:'#000',strokeThickness:2}).setOrigin(1,0));
    }

    // map name badge
    const mn=T(16,16,track.map.emoji+' '+track.map.name,{fontSize:'14px',fill:'#fff',stroke:'#000',strokeThickness:2,fontStyle:'bold'}).setOrigin(0,0);

    // boost speed-lines overlay
    this.speedLinesGfx=scene.add.graphics().setScrollFactor(0).setDepth(49);
    // lap flash tracking
    this._lastLap=0;this.lapFlash=null;
  }

  update(){
    const p=this.player,rm=this.rm;
    if(!rm.started){
      this.cdTx.setText(rm.countdown>0?String(rm.countdown):'').setVisible(true);
    }else if(rm.raceTimer<1100){
      this.cdTx.setText('GO!').setVisible(true);
    }else this.cdTx.setVisible(false);
    if(p.finished){
      const pos=['1ST','2ND','3RD','4TH','5TH','6TH'][p.position-1]||`${p.position}TH`;
      this.finTx.setText(`YOU FINISHED ${pos}!`).setVisible(true);
    }
    const ps=['1ST','2ND','3RD','4TH','5TH','6TH'][p.position-1]||`${p.position}TH`;
    const pc=['#f1c40f','#c0c0c0','#cd7f32','#fff','#fff','#fff'][p.position-1]||'#fff';
    this.posTx.setText(ps).setColor(pc);
    this.lapTx.setText(`LAP ${Math.min(p.lap+1,TOTAL_LAPS)}/${TOTAL_LAPS}`);
    this.spdTx.setText(`${Math.abs(Math.round(p.spd*0.21))} km/h`);
    if(rm.started){
      const t=rm.raceTimer,m2=Math.floor(t/60000),s2=Math.floor((t%60000)/1000),ms=t%1000;
      this.timeTx.setText(`${m2}:${String(s2).padStart(2,'0')}.${String(ms).padStart(3,'0')}`);
    }
    this.itemTx.setText(p.heldItem?ITEM_ICONS[p.heldItem.type]||'?':'');
    this.fxTx.setText((p.fx.star?'⭐':'')+(p.fx.shield?'🛡️':'')+(p.fx.lightning?'⚡':'')+(p.inIce?'❄️':''));
    this.driftBar.clear();
    if(p.driftState==='drifting'&&p.driftQ>0){
      const col=[0x44aaff,0xff8800,0xaa00ff][p.driftLv]||0x44aaff;
      this.driftBar.fillStyle(col,1);
      this.driftBar.fillRect(W/2-79,H-24,158*Math.min(p.driftQ/100,1),10);
    }
    // ── Lap change flash
    if(p.lap>this._lastLap){
      this._lastLap=p.lap;
      if(this.lapFlash){try{this.lapFlash.destroy();}catch(e){}this.lapFlash=null;}
      const msg=p.lap>=TOTAL_LAPS?'FINAL LAP!':('LAP '+(p.lap+1)+'/'+TOTAL_LAPS);
      const col=p.lap>=TOTAL_LAPS?'#ff4400':'#ffffff';
      sfxBeep(true);
      this.lapFlash=this.scene.add.text(W/2,H/2-50,msg,{
        fontSize:'74px',fill:col,fontStyle:'bold',stroke:'#000',strokeThickness:11
      }).setScrollFactor(0).setDepth(201).setOrigin(0.5);
      this.scene.tweens.add({targets:this.lapFlash,alpha:0,scaleX:1.5,scaleY:1.5,
        duration:1400,ease:'Power2',
        onComplete:()=>{if(this.lapFlash){this.lapFlash.destroy();this.lapFlash=null;}}});
    }
    // ── Boost speed lines
    this.speedLinesGfx.clear();
    if(p.boostT>80&&p.spd>180){
      const alpha=Math.min(0.38,(p.boostT/1400)*0.5);
      const cx=W/2,cy=H/2;
      for(let i=0;i<18;i++){
        const ang=Math.random()*Math.PI*2;
        const r1=90+Math.random()*70,r2=r1+55+Math.random()*90;
        this.speedLinesGfx.lineStyle(1+Math.random()*1.5,0xffffff,alpha*(0.4+Math.random()*0.6));
        this.speedLinesGfx.beginPath();
        this.speedLinesGfx.moveTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1);
        this.speedLinesGfx.lineTo(cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2);
        this.speedLinesGfx.strokePath();
      }
    }
    this._minimap();
    const sorted=[...this.karts].sort((a,b)=>a.position-b.position);
    for(let i=0;i<this.rankTx.length;i++){
      const k=sorted[i];if(!k){this.rankTx[i].setText('');continue;}
      const rp=['1ST','2ND','3RD','4TH','5TH','6TH'][i]||`${i+1}`;
      this.rankTx[i].setText(`${rp} ${k.def.name}`).setColor(k===this.player?'#f1c40f':'#ddd');
    }
  }

  _minimap(){
    const g=this.mmGfx;g.clear();
    const mx=this.mmX,my=this.mmY,mw=this.mmW,mh=this.mmH;
    const m=this.track.map;
    const sx=mw/m.ww,sy=mh/m.wh;
    const ox=mx-mw/2,oy=my-mh/2;
    const sp=this.track.spine;
    g.lineStyle(3,0x999,0.9);g.beginPath();
    g.moveTo(ox+sp[0].x*sx,oy+sp[0].y*sy);
    for(const pt of sp)g.lineTo(ox+pt.x*sx,oy+pt.y*sy);
    g.strokePath();
    for(const k of this.karts){
      g.fillStyle(k.def.col,1);
      g.fillCircle(ox+k.x*sx,oy+k.y*sy,k===this.player?4.5:3);
    }
    g.lineStyle(1.5,0xffffff,1);
    g.strokeCircle(ox+this.player.x*sx,oy+this.player.y*sy,4.5);
  }
}

// ── RACE SCENE ───────────────────────────────────────────────
class RaceScene extends Phaser.Scene{
  constructor(){super('Race');}
  init(d){this.carIdx=d.carIdx||0;this.mapIdx=d.mapIdx||0;}
  create(){
    const mapDef=MAPS[this.mapIdx];
    this.cameras.main.setBackgroundColor(mapDef.skyCol);
    this.cameras.main.setBounds(0,0,mapDef.ww,mapDef.wh);

    this.track=new Track(mapDef);
    this.track.drawScenery(this);
    this.track.draw(this);
    this.boostPads=this.track.drawBoostPads(this);

    const s0=this.track.spine[0],s1=this.track.spine[1];
    const startAng=Math.atan2(s1.y-s0.y,s1.x-s0.x);
    const perp=startAng+Math.PI/2;
    const GRID=[
      {fwd:  0, side:-42},
      {fwd:-60, side: 42},
      {fwd:-120,side:-42},
      {fwd:-120,side: 42},
      {fwd:-180,side:-42},
      {fwd:-180,side: 42},
    ];

    this.karts=[];
    const pDef=CAR_DEFS[this.carIdx];
    const G0=GRID[0];
    const px=s0.x+Math.cos(startAng)*G0.fwd+Math.cos(perp)*G0.side;
    const py=s0.y+Math.sin(startAng)*G0.fwd+Math.sin(perp)*G0.side;
    this.player=new PlayerKart(this,px,py,startAng,pDef);
    this.karts.push(this.player);

    const aiDefs=CAR_DEFS.filter((_,i)=>i!==this.carIdx);
    const wps=this.track.waypoints(60);
    for(let i=0;i<NUM_AI;i++){
      const gi=GRID[i+1];
      const def=aiDefs[i%aiDefs.length];
      const ax=s0.x+Math.cos(startAng)*gi.fwd+Math.cos(perp)*gi.side;
      const ay=s0.y+Math.sin(startAng)*gi.fwd+Math.sin(perp)*gi.side;
      this.karts.push(new AIKart(this,ax,ay,startAng,def,i,wps));
    }

    this.items=new ItemSystem(this,this.track);
    this.hazards=new HazardSystem(this,this.track,mapDef);
    this.rm=new RaceManager(this.karts);
    this.hud=new HUD(this,this.player,this.karts,this.rm,this.track);

    this.cameras.main.setZoom(1.15);
    // Set initial camera position centred on player (manual follow takes over in update)
    const _tz=1/1.15;
    this.cameras.main.scrollX=this.player.x-(W*0.5)*_tz;
    this.cameras.main.scrollY=this.player.y-(H*0.5)*_tz;
    this._ended=false;
  }

  update(_t,dt){
    const s=dt/1000;
    // ── Manual look-ahead camera: player always stays centred, slight forward bias
    {
      const cam=this.cameras.main;
      const p=this.player;
      const zoom=cam.zoom;
      const ahead=Math.min(Math.abs(p.spd)*0.10,90);
      const tx=p.x+Math.cos(p.ang)*ahead-(W*0.5)/zoom;
      const ty=p.y+Math.sin(p.ang)*ahead-(H*0.5)/zoom;
      const m=this.track.map;
      cam.scrollX=lerp(cam.scrollX,clamp(tx,0,m.ww-W/zoom),0.15);
      cam.scrollY=lerp(cam.scrollY,clamp(ty,0,m.wh-H/zoom),0.15);
    }
    this.rm.update(dt);
    if(this.rm.started){
      for(const k of this.karts)k.update(dt,this.track,this.karts,this.items,this.hazards);
      this.items.update(s,this.track,this.karts);
      this.hazards.updateRocks(s);
      this.hazards.updateFallingKarts(s);
      this.hazards.checkRockHits(this.karts);
      for(const pad of this.boostPads){
        for(const k of this.karts){
          if(k.boostT<=0&&dist(k.x,k.y,pad.x,pad.y)<30){
            k.boostT=900;k.boostPow=130;sfxBoost();
          }
        }
      }
    }
    this.hud.update();
    if(this.rm.finished&&!this._ended){
      this._ended=true;
      this.time.delayedCall(3800,()=>{
        this.items.destroy();this.hazards.destroy();
        this.scene.start('Results',{
          results:this.karts.map(k=>({
            name:k.def.name,col:k.def.col,pos:k.position,
            time:k.finTime||this.rm.raceTimer,isPlayer:k===this.player
          })),
          carIdx:this.carIdx,mapIdx:this.mapIdx
        });
      });
    }
  }
}

// ── RESULTS SCENE ────────────────────────────────────────────
class ResultsScene extends Phaser.Scene{
  constructor(){super('Results');}
  init(d){this.results=d.results||[];this.carIdx=d.carIdx||0;this.mapIdx=d.mapIdx||0;}
  create(){
    this.cameras.main.setBackgroundColor('#0c0820');
    this.add.text(W/2,48,'RACE RESULTS',{fontSize:'52px',fill:'#f1c40f',fontStyle:'bold',stroke:'#000',strokeThickness:7}).setOrigin(0.5);
    const sorted=[...this.results].sort((a,b)=>a.pos-b.pos);
    const medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
    const posN=['1ST','2ND','3RD','4TH','5TH','6TH'];
    for(let i=0;i<sorted.length;i++){
      const r=sorted[i],y=148+i*68;
      if(r.isPlayer)this.add.rectangle(W/2,y,W-60,60,0x2a1b6e,0.9).setStrokeStyle(2,0xf1c40f);
      this.add.text(90,y,medals[i]||'  ',{fontSize:'36px'}).setOrigin(0.5);
      this.add.text(188,y,posN[i],{fontSize:'28px',fill:r.isPlayer?'#f1c40f':'#fff',fontStyle:'bold'}).setOrigin(0.5);
      const sw=this.add.graphics();sw.fillStyle(r.col||0xffffff,1);
      sw.fillRoundedRect(-17,-11,34,22,4);sw.x=308;sw.y=y;
      this.add.text(395,y,r.name,{fontSize:'24px',fill:r.isPlayer?'#f1c40f':'#ccc'}).setOrigin(0.5);
      const t=r.time||0,m=Math.floor(t/60000),s=Math.floor((t%60000)/1000),ms=t%1000;
      this.add.text(585,y,`${m}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`,{fontSize:'20px',fill:'#aaa'}).setOrigin(0.5);
      this.add.text(775,y,`${POINTS[i]||1} pts`,{fontSize:'22px',fill:'#f39c12',fontStyle:'bold'}).setOrigin(0.5);
    }
    const btn=(x,lbl,bg,cb)=>{
      const t=this.add.text(x,H-50,lbl,{fontSize:'21px',fill:'#fff',fontStyle:'bold',stroke:'#000',strokeThickness:3,backgroundColor:bg,padding:{x:16,y:10}}).setOrigin(0.5).setInteractive({useHandCursor:true});
      t.on('pointerdown',cb);t.on('pointerover',()=>t.setStyle({fill:'#f1c40f'}));t.on('pointerout',()=>t.setStyle({fill:'#fff'}));
    };
    btn(W/2-190,'▶  RACE AGAIN','#1a6e30',()=>this.scene.start('Race',{carIdx:this.carIdx,mapIdx:this.mapIdx}));
    btn(W/2+10,'🗺  CHANGE COURSE','#1a4070',()=>this.scene.start('MapSelect',{carIdx:this.carIdx}));
    btn(W/2+235,'⟵  MENU','#6e1a1a',()=>this.scene.start('Menu'));
    this.input.keyboard.on('keydown-ENTER',()=>this.scene.start('Race',{carIdx:this.carIdx,mapIdx:this.mapIdx}));
    this.input.keyboard.on('keydown-ESC',()=>this.scene.start('Menu'));
  }
}

// ══════════════════════════════════════════════════════════════
//  LAUNCH
// ══════════════════════════════════════════════════════════════
new Phaser.Game({
  type:Phaser.AUTO,
  width:W,height:H,
  parent:'game-container',
  scene:[BootScene,MenuScene,MapSelectScene,RaceScene,ResultsScene],
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
});
</script>
